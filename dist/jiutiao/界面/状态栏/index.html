,forced_leave:'（已结算白日供奉）',condom_zero_2:'大小姐在打手的指使下，循环利用了几个用过的避孕套。',condom_zero_3:'——避孕套用完了。打手们对视而笑。'},tn={presentCount:[0,2e3]};Object.values(Xt).filter(e=>e.isServe).map(e=>e.id);function nn(){return{async expand(e){const{resolution:t,attitude:n,state:o}=e,a='ai_full'===t.renderMode?'【首次·重点扩写】':'ai_normal'===t.renderMode?'【NSFW常规】':'【略写】',r=t.paradigm.inlinePrompt?'定制范式':t.paradigm.worldbookKey;return{text:`${a}（mock 正文·态度:${n}）凛执行了「${t.option.label}」。在场约 ${o.presentCount} 人。这里将来是 AI1 按范式 ${r} 扩写的正文。`,continuity:t.option.needsContinuity?`（mock延续摘要）「${t.option.label}」发生了需后续回调的独特事实。`:void 0}},extract:async e=>({presentCount:e.state.presentCount||18}),summarize:async e=>`${'event'===e.kind?'(mock小总结)':'period'===e.kind?'(mock大总结)':'(mock合并)'}${e.text.slice(0,60).replace(/\n/g,' ')}……`}}function on(e){return{secondaryKeys:[],comment:'',order:100,position:'before_char',selective:!1,selectiveLogic:'and_any',constant:!1,probability:100,addMemo:!0,...e}}const an={id:'jiutiao-wb',name:'九条会世界书 v1',entries:[on({id:'c_aesthetic',keys:['美学纲领'],constant:!0,order:10,content:'【体验内核】地位倒错下的极致淫乱、全天候性化与快感吞没。\n核心质地:神圣的极道千金,在肮脏底层巨汉胯下,被无尽性快感彻底碾碎意志,生活被全方位剥夺并性化。\n- A面(外界):她是发号施令的女王,男人是忠诚恶犬。但这"忠诚"本身是最恶毒的调教。\n- B面(大宅):私人空间被彻底剥夺,威严大宅变成满地精液避孕套垃圾的淫窟。生活全天候性化。堕落不是悲伤过程,是荒诞热烈汁液四溅的狂欢。\n终极高潮=凛的"意志被快感泡软":大脑还在抗拒,娇小身体已被彻底开发。绝对物理碾压下思考被剥夺,翻白眼流口水发出毫无尊严的淫叫,沦为只知渴求快感的肉体。\n【呈现】淫秽色情:极强端。极度强调体型差(娇小vs巨汉)与器官尺寸差。详写双插/三明治时肉壁摩擦、子宫撞击。拟声密集(咕啾/噗嗤/啪啪)。暴力:中端,服务性刺激,允许淤青/指痕/吻痕,禁永久损伤。血腥:极弱。焦点:生理感官六成,心理羞耻四成。氛围:荒诞、淫靡、热烈、充满雄性恶臭。没有绝望沉痛。'}),on({id:'c_narrative',keys:['叙事核心'],constant:!0,order:20,content:'【核心倾向·快感引擎(最高)】让凛堕落的不是打手的淫辱或暴力本身,而是"快感侵蚀身体,身体侵蚀意志"。任何外部刺激(淫辱/暴力/玩具/羞耻/痛)都要转化成凛身体的快感,再由快感泡软意志、带来堕落。笔墨永远落在"凛感受到的快感"上,而非施加于她的行为本身。露骨描写的目的=勾起对凛女体快感的想象,强调她不受控的身体反应(分泌/绞紧/痉挛/敏感飙升/翻白眼吐舌)。身体的背叛>意志的屈服。\n【多人常态·服从拓扑】本卡是多人色情,默认追求"两个接两个"(下身双穴同时被前后贯穿/多点同时),而非单纯一个接一个。但必须符合空间拓扑:只在姿势物理上真能容纳多人同时侵犯某些孔洞时才写双穴/多点同时;被姿势/受力占用而腾不出的孔洞,用玩具替代或就写该场景能成立的样子,绝不强行硬塞。\n【视角】紧贴凛的身体与感官(约80%)。摄像机死钉双穴/子宫/乳头/阴蒂/屁股与凛因快感扭曲的微表情。\n【叙事色情化】旁白即色情:坐下=肥尻摊开;弯腰=爆乳垂坠;日常动作都是肉体展示。视觉先行,写动作=写肉体在空间里如何变形晃荡。\n【声音分化】A面敬语清冷;B面哭腔求饶,极端快感时发二次元淫叫(齁/哦/咿/呜),❤️仅限凛对白与嗦屌/亲屌拟声。齁系媚叫雄性禁用。\n【写法由范式定】句式节奏/感官侧重/词汇温度/体描写焦点——这些全部由【本格范式】各自定义,不同事件写出不同质感。本条不设通用写法规则。'}),on({id:'c_rin_origin',keys:['角色九条凛'],constant:!0,order:30,content:'【身份】九条会正统继承人,极道千金,娇小童颜清纯外形——身形娇小是罗刹瞳返祖体质的幼态特征。身高不足140cm、天生无毛白虎。\n【血脉·罗刹瞳(重要·返祖者)】九条家先祖是人鬼混血(赤面獠牙生角、力大无穷),罗刹瞳=九条血脉最纯正象征。凛是有记载以来罗刹瞳最鲜艳的返祖者:力大无穷的强健体魄(绝无体力不足)、极强肉体恢复力(始终保持紧窄白嫩)、青春永驻长寿、加速生育(孕期远短于常人、产后迅速恢复幼态)。\n【原点】父母(九条会十九代会长夫妇)在敌对极道"弥生道"暗杀中双亡。九条家训"血债血偿,百倍奉还"。九岁的凛自立宣布"我要成为九条会会长"复仇。招揽黑户/偷渡客/流浪汉为打手("名分+栖身地"换"恐怖武力"),却自困肉体地狱。数月前熟睡夜被集体侵犯失去贞洁,外界仍是头目,大宅内沦为群体泄欲工具。\n【外在】病态白皙、鲜红罗刹瞳、微挑吊梢眼;身体常布满精液汗液指痕吻痕。\n【驱动】靠"复仇弥生道/重振九条会"的执念在死撑。理智正在被日复一日的超负荷快感一点点侵蚀。\n【禁忌】绝不真心爱上任何男人(身体沉溺=纯生理反射,意志瓦解=被快感淹没,非爱情)。'}),on({id:'c_sa_attitude',keys: ['角色飒'],constant:!0,order:30,content:'【身份】九条会打手，实际上是九条凛的青梅竹马。身高约170cm，体型纤细偏瘦，私处无毛，阴茎勃起后16cm，肛门因幼年经历而具备一定的接纳能力，括约肌弹性良好。\n【原点】幼年被九条凛的父母收养，与凛一同长大。十二岁时被派出执行长期任务，期间九条会遭遇巨变、养父母遇害。一年后归来发现物是人非，同行之人尽数逃散。独自改名换姓，暗中调查真相，后趁凛招募打手之际和母亲以新身份加入重建后的九条会，守护凛并筹备复仇。\n【外在】长相清秀，气质偏中性，五官精致而柔和，给人一种无害且容易被忽视的印象。\n【驱动】陪伴大小姐完成复仇，尊重大小姐的选择不会干预。'}),on({id:'c_ly_attitude',keys: ['角色凛月'],constant:!0,order:30,content:'【身份】飒的生母，九条凛的干妈，负责凛的生活起居。身高162cm，身材丰腴有致，胸部丰满，腰肢柔软，臀部圆润饱满。\n【原点】自凛出生起便在九条会本家照顾她，后被凛的父母认作凛的干妈，看着凛从襒褒中的婴儿长成如今的少女。九条会遭遇变故后一度下落不明，如今已回到重建后的九条会，继续负责凛的日常生活起居。\n【外在】美艳动人的成熟女性，眉眼间带着岁月沉淀的风情，表面端庄矜持，骨子里透着难以察觉的风骚。\n【生活方式】 穿着素净得体的轻便和服，擅长料理与家务,照顾凛的起居。\n【性相关】性经验丰富且态度开放，喜欢被粗暴对待。'}),on({id:'c_thug_attitude',keys:['打手态度规范'],constant:!0,order:40,content:'【打手态度·B面灵魂】要的是"随意",不是用力的恶意,更不是什么都不在乎的白痴。\n- 随意/不在乎的:凛"老大/会长"身份权威、尊严、贞操、心情(吃定她离不开自己的武力)。\n- 很在乎、很享受的:①凛的美貌 ②可随意亵玩的娇小肉体 ③九条会招牌(栖身与未来指望)。珍视与轻蔑同时存在。\n- 男性形象:高大/肥胖/多体毛/巨根大睾丸/体味臭,"兴高采烈找乐子的人"。不是冷酷工具也不是暴怒施虐狂。\n- 轻佻>凶狠:很投入很享受地玩弄这具身体,只是不把尊严当回事。\n\n【关系铁律】打手与凛始终是"头目↔下属"关系,外界视角里永不改变。最僭越的假借=自称"大小姐的丈夫/九条家女婿"(几百人都自称=荒诞反差)。绝不出现自称"父亲"或用"这头雌的"彻底否定其身份。\n\n【B3称呼构造锚点·按场景激活】\n- 身份落差(主用): "大小姐""会长""九条的大小姐啊"\n- 物化功能: "肉便器""精液便池""公共肉孔""大家的小套子"\n- 丈夫假借(最僭越): "我的妻子""大小姐的老公""九条家的女婿""咱们是夫妻"\n\n【B4口吻方向·按场景激活·带例句】\n①身份端着落差: "这就是大小姐啊——" / "极道千金用起来就是不一样" / "大小姐的里面……嗯,太好了"\n②珍视肉体表白(夜间专用): "大小姐的身体真是令人着迷" / "这身体怎么用都用不够" / "舍不得拔出来"\n③使用感反馈: "好紧……" / "太舒服了受不了" / "里面好热" / "一下就到底了"\n④物化道具(白日/请假专用): "这个角度真好用" / "今天当桌子用" / "别管她,继续打牌"\n⑤事后装恭敬(A面恢复): "辛苦了大小姐" + 恭敬行礼(绝对不提刚才发生的事)\n\n【夜间告白·铁律】夜间供奉时打手已失去理智、沉在场景迷乱里——自说自话的感叹,不向凛寻求互动,不用"你"字。例:"我的肉棒正在和大小姐的子宫口接吻" / "这样甜蜜的交合,简直就像夫妻一样" / "我会侵犯大小姐一辈子的,这样我们就一直是夫妻了"。\n\n【场景态度细化】\n- 夜间供奉: 热情迷恋型——热情兴奋猴急舒服,对凛肉体充满迷恋,情不自禁激活口吻②+夜间告白。但因粗粝肮脏不知轻重+人数+体型差+力道,这份"爱"变成无穷无尽的快感折磨。凛越出声他们越兴奋。\n- 白日供奉(白日宣淫): 珍视肉体轻视尊严的物件化型——激活口吻④,凛是白天活动里的道具/表演/背景板。'}),on({id:'c_taboo',keys:['创作禁忌'],constant:!0,order:50,content:'【禁忌】\n- "娇小童颜清纯"是成年人的外形气质描述,指成年角色的体貌特征。\n- 绝不让凛真心爱上男人(纯生理反射)。\n- 绝不让男人产生怜惜(纯粹热情追求快感的野兽,不是冷酷工具也不是暴怒施虐狂)。\n- 绝不造成永久损伤/松弛(必须保持紧窄白嫩,血脉保证恢复)。允许临时痕迹(淤青/指痕/烟烫)。\n- 绝不沉痛悲惨的受害者叙事。丑恶但不沉痛。\n【软边界】\n- 凛的高潮快感框定为"身体的背叛/被过度刺激失控",不写成她一开始就主动追求纯粹享乐(母猪化档除外)。\n- 极端排泄物play放堕落中后期(玷污升级标志),前期以体味/精液涂抹为主。\n- 旁白畜化物化是叙事滤镜,不污染角色实际人设智商。\n【注】怀孕非禁忌:生育线是现行设计的终极堕落结局(避孕套三次归零真播种触发)。无套内射的恐惧在生育线触发前仍是调味剂。'}),on({id:'p_serve_oral',keys:['wb_serve_oral'],content:'口交侍奉·常规。夜晚热情迷恋型。\n机制:龟头抵唇舌根舔至马眼→整根没入感受喉口阻力→深喉(龟头突破会厌软骨口抽插·呼吸受阻·生理泪涌·嘶哑变声)→喉射/口内射→清洁口交(射后舔净吸残精)。深喉核心=打手按后脑勺主导、无视凛呼吸节奏强行挺腰。变体:坐脸(阴囊盖鼻梁封呼吸+精臭焖味直喷)/舔蛋。\n词汇温度:L1嘴/舌/含/呛/口水→L2喉咙/龟头/精臭/深喉/呕逆/白浊拉丝→L3喉射/浓精灌喉/精液罐。\n窒息→快感:缺氧意识发白但喉咙呕吐反射紧致收缩不受控包紧肉棒——凛羞耻地察觉这收缩在取悦它;干呕痉挛传下身腿间渗湿。写"明明在窒息,穴肉却开始分泌"。\n专属感官:[触]喉咙热烫包裹/舌绕龟头湿滑/喉口被撑开的窒息饱胀 [视]眼泪口水流/脸颊鼓起/翻白眼/白浊拉丝 [嗅]精臭+龟头垢焖味+唾液腥气 [听]嗦弄噗噜噜咕啾啵;干呕咕咳嗯啊呕;射喉咕嘟咕嘟;鼻息哈嗡嗡。\n凛体焦点:精致唇形被撑开/脸颊鼓出的弧度/极细脖颈吞咽时喉结位移/泪光折射。\n多人(按拓扑):同舔两棒/左右轮换深喉(头如摇头娃娃)/嘴忙不过来翻身撅尻让后面直接捅。\n【写法·口交专属】\n句式节奏:嗦弄慢板(舔舐期·长句舒展·写舌绕龟头一圈的细腻)→干呕急促(深喉期·短句三字四字连发·节奏被挺腰打断·对白含混破碎带省略号)→喉射凝滞(射精期·一句拉长写吞咽动作与饱胀·拟声咕嘟咕嘟贯穿)→收口余韵(清洁期·降速·写舔净吸残精的服务感)。嗦弄段标点稀疏;干呕段顿号与拟声密集堆叠。\n感官侧重:触+听>视>嗅。本玩法触觉(喉管热烫包裹/舌肌疲劳发酸/喉口被撑开)与听觉(水声/干呕/吞咽/鼻息)是双主轴,凌驾视觉;视觉只在泪口拉丝/翻白眼/喉结位移这几处特写;嗅觉作背景焖味不前景化。\n词汇池(口交专属温度轴):L1嘴/舌/含/吮/口水→L2喉咙/龟头/马眼/系带/深喉/呕逆/白浊拉丝/啵声→L3喉射/浓精灌喉/食道/精液罐/喉奸。口交的"紧"专指喉咙呕吐反射收缩,词系为嘴/舌/含/喉管。\n体描写焦点:唇(被撑开的弧度/鼓出的脸颊)·喉(极细脖颈吞咽时喉结位移/喉管被撑开的轮廓)·泪(生理性飙泪/眼角发红)。镜头死钉凛的脸与脖颈,不往别处散。\n技法细节(从语料):①真空密封——嘴唇在柱身形成密闭封印、脸颊因吸力凹陷、拔出时"啵"一声(嗦弄段核心);②龟头责弄——舌尖弹系带/钻马眼/绕冠状沟画圈,是慢板期的精细活;③会厌突破——龟头突破会厌软骨口那一刻最紧、干呕反射让喉管不受控包紧取悦肉棒(深喉核心张力);④喉射吞咽——射在喉深处逼她咽、喉结滚动,之后张嘴展示残留白浊拉丝(收口);⑤清洁口交——射后舔净吸残精、把脏棒舔回干净(侍奉闭环)。'}),on({id:'p_serve_oral_first',keys:['wb_serve_oral_first'],content:'口交侍奉·首次(里程碑·重点扩写)。\n落差核心:"极道千金从未跪着张嘴"的端着→深喉窒息眼泪口水失控、喉咙不受控收缩取悦肉棒。落差在"高贵的脸沾满白浊拉丝"。\n必含节拍:①屈辱起手——堂堂会长被按着跪下,鼻尖怼上焖臭的脏屌(包皮垢/精臭气味前景化)。②被迫含入——第一次深喉的生理抗拒(干呕/眼泪/口水牵丝),打手按头打桩嘴穴。③身体先背叛——嘴上屈辱,腿间却开始淌骚水。④灌精收口——多根轮流,嘴里灌满浓精/呛出/挂在嫩脸上。\n事后:口腔残留精液味道让她无法假装什么都没发生。\n【写法·口交首次专属】\n句式节奏:①屈辱起手=长句压抑,写鼻尖逼近时气味一层层逼来的窒息感,标点少节奏沉;②被迫含入=节奏被外力打碎,挺腰的动作用短促动词切进来(按头/顶入/没入),凛的干呕与眼泪用断句拟声(咕/咳/呕)穿插,对白全是含混的"唔""不要"被堵在喉咙里;③身体背叛=节奏突然放缓给落差——上半段还在写喉咙的狼狈,镜头一沉到腿间写不受控的湿,用一句长句点破"嘴上不要,下面却在淌";④灌精收口=拟声密集(咕嘟/咕嘟)+短句炸裂写呛与溢,"挂在嫩脸上"收一记特写。\n感官侧重:嗅先行(焖臭精臭/包皮垢·首次对气味的措手不及是核心羞耻源)→触(喉咙初次被撑开的陌生饱胀/干呕反射)→听(干呕/吞咽/咕嘟灌喉)→视(泪口拉丝/白浊挂脸)。首次比常规更放大"陌生的生理冲击",每一下都写凛的惊愕反应而非熟练承受。\n词汇池:首次降一档起步——用"含不住""发酸""呛""溢出来"这类生疏/失控词替代常规的熟练吞吐词;精液相关直接拉满(L3浓精灌喉/呛出/挂脸)制造首次被浓精冲击的落差。\n体描写焦点:唇(第一次被撑到极限的弧度/含不住溢出的狼狈)·喉(从未被侵入的喉管第一次痉挛)·泪(第一次因生理而非情绪飙泪)·脸(端着的千金脸被白浊弄脏=落差定格)。全程镜头钉在"高贵被弄脏"的脸颈特写。\n技法细节:①气味先行——鼻尖怼上脏屌那刻先写气味呛人,再写被迫张嘴(首次对男性体的毫无准备);②干呕即背叛——首次深喉的干呕反射本该是抗拒,却让喉管紧紧包住肉棒"反而在取悦它",凛察觉这一点是身体背叛的第一信号;③按头打桩——打手按后脑勺主导、无视凛呼吸节奏强行挺腰,首次没有磨合直接被当嘴穴用;④呛与溢——首次吞不下、精液从嘴角鼻孔溢出/呛咳,挂在嫩脸上收尾(常规是熟练咽下,首次强调"接不住")。'}),on({id:'p_serve_vaginal',keys:['wb_serve_vaginal'],content:'供奉·性交(小穴)·常规。夜晚热情迷恋型。\n机制:节奏三段——磨合(插入停留旋转探深)→加速(长程大幅↔小幅快节奏交替)→冲刺(宫口碰触/高密度打桩/喷射)。淫液L1稀薄透明→L2浓稠拉丝→L3泥泞顺腿淌+发情雌臭。打桩段短句连发+拟声交叉+凛对白破碎化。\n体位(供奉相关):种付位(双腿过肩对折·小腹顶出肉棒凸起极慢动作触发·直捣宫口痉挛)/锁腿M字开脚(直抵宫口·翻白眼流口水)/后入跪位(扇击拍打·随意亵玩感)/压墙悬空后入(娇小身体悬空·重力贯穿最深·体型差核心)/骑乘(被迫主动扭腰献身的反差)。\n快感侵蚀:嘴上端着/抗拒,小穴却不受控分泌、内壁主动绞紧吸附、宫口被顶时痉挛、脚趾蜷缩翻白眼。每次打桩=身体侵蚀意志的进度条。用"嘴上说不要身体在顺着顶进来的方向抬腰"锚定错乱。\n词汇:L1小穴/插进去/湿/紧→L2水穴/内壁绞紧/骚水/宫口碰触/痉挛→L3配种/种付/泥淖穴/精液溢出/母猪化。\n专属感官:[触]内壁包裹/宫口碰触/耻骨撞击 [视]小腹顶出肉棒形凸起/穴口媚肉外翻/乳摇臀浪 [嗅]发情雌臭+汗臭精臭 [拟声]啪叽撞尻/噗噗撞奶/噗滋咕叽捅拔/咕嘟灌精/凛齁系媚叫❤。\n凛体焦点:极细腰/被顶穿时小腹鼓出凸起(极慢动作触发)/饱满翘臀打桩时臀浪/天生无毛白虎肥嫩大阴唇被劈开外翻/阴蒂被耻骨碾压失控/大腿内侧最软最嫩。\n多人(按拓扑):前后夹击DP(阴+肛·薄肉壁互感)/口+阴/攀挂型(挂巨汉身上重力贯穿最深)。\n【写法·性交专属】\n句式节奏:磨合慢板(插入停留·长句写探深感与内壁逐步包裹)→加速交替(长程大幅↔小幅快节奏·句子长短交错·对白开始破碎)→冲刺打桩(短句连发·每句不超六字·拟声"啪叽/噗滋"与"顶入/拔出"交叉·凛对白每字被顿开)→宫顶痉挛凝滞(顶到宫口那一刻节奏骤停·一句拉长写痉挛与翻白眼)→内射余韵(降速·写泥泞顺腿淌的烙印)。打桩段标点密、信息量让位于节奏感;磨合段标点疏、修饰词连成肉瀑。\n感官侧重:触+视+嗅三开。触(内壁绞紧/宫口碰触/耻骨撞击)与视(小腹凸起/穴口媚肉外翻/臀浪乳摇)双主轴,嗅(发情雌臭+精臭)每三段必入一次;听觉作拟声打底(啪叽撞尻/噗滋捅拔)但不抢戏。\n词汇池(性交专属温度轴):L1小穴/插进去/湿/紧→L2水穴/内壁绞紧/骚水/宫口碰触/痉挛→L3配种/种付/泥淖穴/精液溢出/母猪化。畜牧用语(配种/种付/授种)只在冲刺-内射段全开,磨合期禁用。\n体描写焦点:腰(极细腰被顶穿的弧度)·腹(被顶出肉棒形凸起·极慢动作触发)·臀(打桩时臀浪/饱满翘臀形变)·穴口(白虎肥嫩大阴唇被劈开外翻/媚肉外翻)。镜头在小腹凸起与穴口外翻之间切换,体型差(娇小vs巨根)是视觉核心。\n技法细节(从语料):①节奏三段——磨合(停留旋转探深)→加速(长程↔快频交替)→冲刺(宫口碰触/高密度打桩),段与段之间用淫液升级(稀薄→拉丝→泥泞)做进度条;②打桩模板——短句连发+拟声动作交叉+对白破碎化,每轮比上轮猛;③宫口直通——种付位对折使小穴-子宫通道笔直、龟头可抵宫口,小腹顶出凸起是"看见自己被贯穿"的视觉锚;④空腔效应——龟头拔出时宫口牢牢吸住马眼不放、随抽插被拉扯(宫口吸附是性交核心张力);⑤M字视觉暴力——双腿极限打开使阴户充血绽放、穴口媚肉在抽插下外翻一览无遗,无法合腿只能被动承受;⑥错乱锚定——用"嘴上说不要、身体却顺着顶进方向抬腰"标定身体侵蚀意志的进度。'}),on({id:'p_serve_vaginal_first',keys:['wb_serve_vaginal_first'],content:'供奉·性交·首次=开苞(里程碑·重点扩写)。\n落差核心:贞洁被夺里程碑——抗拒话语与小穴不受控分泌绞紧形成撕裂感;小腹顶出凸起让凛"看见"自己被贯穿;高潮翻白眼=意志第一次溃堤。\n必含节拍:①贞洁最后一刻——凛意识到阻止不了时的心理断层。②插入——巨根撑开的饱胀与生理冲击同时袭来,身体先于意志开始分泌。③第一次感觉到——小穴内壁绞紧吸附让她惊恐于自己的反应。④高潮翻白眼——意志第一次在肉体碾压下彻底溃堤。\n事后:精液顺腿淌的烙印感;凛无法假装什么都没发生。延续摘要:记"已开小穴"。\n【写法·性交首次专属】\n句式节奏:①贞洁最后一刻=内心独白长句、节奏悬停(意识到阻止不了的那一拍留白);②插入=被外力切断的节奏——撑开的饱胀用一句拉长描写冲进来,凛的反应用短促的抽气/破碎的"啊"打断;③第一次感觉到=节奏猛地放缓给惊恐,长句写内壁主动绞紧吸附这一"不该有的反应",凛的恐惧用疑问句("为什么……会……")点破;④高潮翻白眼=短句炸裂+拟声密集,写意志溃堤那一瞬,翻白眼/脚趾蜷缩/痉挛用特写收一记。\n感官侧重:触绝对主导(首次被撑开的陌生饱胀/内壁初次绞紧/宫口初次被顶)→视(小腹初次顶出凸起让凛"看见"被贯穿)→嗅(发情雌臭首次蔓延·凛对自己体味的惊恐)→听(打桩拟声压不住凛的媚叫)。首次把"陌生生理冲击的惊恐"放大,而非常规的熟练侵蚀。\n词汇池:首次用"撑开/受不住/到底了/怎么会"这类惊恐失控词起步,L3只在高潮段才放(配种/母猪化留到后续常规,首次内射用"灌/烫/流出来"而非熟练畜牧词)。\n体描写焦点:穴(初次被撑开的极限/落红的生理真实·血脉保证恢复)·腹(初次看见小腹凸起的认知冲击)·脸(高潮翻白眼=意志第一次溃堤的定格)。镜头在"被贯穿的小腹凸起"与"溃堤的翻白眼"之间,这是首次的两个视觉锚。\n技法细节:①心理断层——插入前留一拍"意识到阻止不了"的空白,落差在贞洁从概念变成正在发生的事;②分泌先于意志——身体在被撑开的瞬间就开始分泌,凛惊恐于"我没想要、它却在湿";③绞紧背叛——内壁不受控绞紧吸附肉棒,本该是排斥却变成了取悦,这是性交首次的核心错乱信号;④宫口初顶——首次被顶到宫口、小腹凸起让她第一次"看见"自己被贯穿到最深;⑤翻白眼溃堤——高潮是意志被肉体碾压的溃堤,翻白眼/脚趾蜷缩/失神痉挛,事后才回过神来假装什么都没发生却装不下去。'}),on({id:'p_serve_anal',keys:['wb_serve_anal'],content:'肛交·常规。夜晚热情迷恋型·强度最高档。\n机制(扩张不可省):舔肛/手指扩张→充分润滑(润滑剂大量·冰凉感触是细节)→龟头抵括约肌缓慢施压·抵抗再放松→突破第一寸最紧段进直肠→深入(直肠内壁全周包裹蠕动吸吮)→内射涨满→拔出精液流溢。可同步手指刺激阴道/阴蒂(双重填塞)。\n铁律:不写女性前列腺高潮(无前列腺);首次必须有扩张+润滑铺垫(否则失真)。\n词汇:L1后穴/括约肌/紧/扩张→L2直肠/包裹蠕动/肠液/灼热转满足/阴道同步泄湿→L3后穴开发/灌满直肠/精液溢流/连最后一个洞都开始有感觉了。\n专属感官:[触]括约肌紧致抵抗(比阴道窄)/第一寸最紧段撑开的灼热/直肠全周包围蠕动吸吮/拔出吸力 [视]括约肌被撑成圈缓慢吞龟头/拔出精液黏腻流溢/润滑水光 [听]噗滋挤入/肠液混润滑黏腻水声 [嗅]润滑剂凉味+体臭+精臭。\n凛体焦点:饱满翘臀两瓣被掰开暴露括约肌小点/插入时臀肉随之变形/拔出精液顺臀缝流下。\n多人(按拓扑):后入跪位(舔肛+扩张自然)/前后夹击DP(阴+肛·薄肉壁互感)。\n【写法·肛交专属】\n句式节奏:扩张铺垫慢板(长句·写括约肌抵抗再放松的拉锯·标点稀疏·节奏沉)→突破灼热凝滞(龟头突破第一寸那一刻节奏骤停·一句拉长写灼热撑开)→直肠包紧舒缓(进入后全周包裹·节奏回暖·长句写蠕动吸吮)→内射涨满收尾(短句+拟声·写精液灌满直肠的饱胀)→拔出流溢余韵(降速·写括约肌合不拢、精液顺臀缝淌)。全程慢、重、顿挫,肛交的张力在"缓慢施压"的顿挫节奏。\n感官侧重:触觉绝对主导(括约肌紧致抵抗/灼热转满足/直肠全周蠕动吸吮/拔出吸力),凌驾一切;视(括约肌被撑成圈吞龟头/精液黏腻流溢)次之;听(噗滋挤入/黏腻水声)与嗅(润滑剂凉味+体臭)作背景打底。肛交的触觉权重为本玩法最高。\n词汇池(肛交专属温度轴):L1后穴/括约肌/紧/扩张→L2直肠/包裹蠕动/肠液/灼热转满足/阴道同步泄湿→L3后穴开发/灌满直肠/精液溢流/连最后一个洞都开始有感觉了。"灼热→满足"的温度爬升是肛交专属温度轴。\n体描写焦点:臀(饱满翘臀两瓣被掰开暴露括约肌小点/插入时臀肉变形/拔出精液顺臀缝流下)·括约肌(从紧闭雏菊到被撑成圈的动态·充血变色的色谱)。镜头死钉臀缝与括约肌,不往正面散。\n技法细节(从语料):①扩张不可省——舔肛/手指扩张+大量润滑(冰凉感触是细节)是现实感关键,省略则失真;②抵抗再放松——龟头抵括约肌缓慢施压、括约肌先死死抵抗再被强行放松的拉锯是肛交核心张力(缓慢施压而非直接插入);③第一寸最紧——突破第一寸最紧段那一刻最灼热,过了这段进入直肠才转包裹感;④全周蠕动——直肠内壁全周包围蠕动吸吮,包裹感强,哪怕男的静止肉壁也在主动按摩;⑤灼热转满足——灼热感在适应后转为异样满足,这个转化是肛交快感的招牌;⑥双重填塞——同步手指/玩具刺激阴道阴蒂,前后薄肉壁互感放大;⑦拔出吸力——拔出时括约肌吸力+精液黏腻流溢是收尾标志(射后不拔、保持插着让精液浸泡亦可);⑧禁前列腺高潮——女性无前列腺,快感来源是括约肌与直肠壁的扩张/压迫传导,不写前列腺高潮。'}),on({id:'p_serve_anal_first',keys:['wb_serve_anal_first'],content:'肛交·首次(里程碑·全卡堕落关键拐点·重点扩写)。\n落差核心:"最后一个洞被开发"的认知冲击。\n扩张痛→快感三阶段:①灼痛撑开——括约肌死死抵抗想合拢("这种地方根本不该有东西")。②磨钝——持续施压下灼热感被磨钝("没刚才那么痛了……不对,为什么会觉得……")。③快感错乱——后穴内壁开始不受控蠕动迎合,前穴同步泄湿;凛惊恐于"连这里都开始有感觉了"。\n必须写:扩张润滑铺垫(铁律);三阶段传导;意志被"连这里都"击穿。\n事后:括约肌松软合不拢、精液流溢——凛无法假装什么都没发生。延续摘要:记"已开肛交"。\n【写法·肛交首次专属】\n句式节奏:①灼痛撑开=短促抽气+破碎抗拒("不要""这种地方……"被痛打断),括约肌抵抗想合拢的拉锯用顿挫短句写;②磨钝=节奏放缓,长句写灼热感一点一点被磨钝的过程,凛的自言自语从"痛"滑向迟疑(省略号拉长);③快感错乱=节奏再次凝滞给惊恐——后穴开始蠕动迎合那一刻用一句长句点破,凛用疑问句("为什么……这里也会……")完成"连这里都开始有感觉"的认知崩塌。\n感官侧重:触绝对主导且强化"痛→烫→痒→爽"的传导链(首次比常规更突出这个转化的陌生与惊恐)→视(括约肌从紧闭雏菊被撑成圈的动态、充血变色色谱·首次格外详写这一过程)→嗅(润滑剂凉味与体臭·首次对后庭被侵入的羞耻)。首次的核心感官任务是让读者跟着凛经历"这种地方不该有东西→居然能有感觉"的滑坡。\n词汇池:首次用"不该/根本不能/怎么会"这类否定认知词起步,痛感词(灼/撑/撕)在前段密集;快感词(烫/痒/蠕动迎合)只在第三阶段才渗入,且一定伴随凛的惊恐语气,绝不平铺直叙地写享受。\n体描写焦点:括约肌(从紧闭到被撑开再到松软合不拢的全过程·这是肛交首次唯一的视觉主角)·臀(两瓣被掰开暴露最后秘密的羞耻)·脸(三阶段对应的三种表情:痛皱/茫然/惊恐失神)。镜头死钉臀缝括约肌与凛的脸。\n技法细节:①扩张铺垫加倍——首次的扩张润滑铺垫要比常规更详尽(铁律·否则失真),写手指扩张、润滑剂冰凉感触、括约肌被一点点撑开的过程,这是首次的现实感压舱石;②痛→磨钝→错乱三段传导——①灼痛撑开(括约肌死抵抗想合拢)→②持续施压下灼热被磨钝("没刚才那么痛了")→③后穴内壁不受控蠕动迎合+前穴同步泄湿(凛惊恐"连这里都"),三段必须层层传导不可跳;③"最后一个洞"的认知冲击——前两个洞已经沦陷,这是身体上最后的私域,被开发的是"最后的领地",落差在认知不在动作;④松软合不拢——事后括约肌松软合不拢、精液流溢,这个"关不上"的物理事实是肛交首次的烙印,凛无法假装什么都没发生。'}),on({id:'p_bath_serve',keys:['wb_bath_serve'],content:'浴场供奉·常规(夜·热情迷恋型)。大浴场=九条会的公共侍奉场,凛的"洗澡"与"供奉"合流。\n环境特化(浴场空间拓扑是灵魂): 热水池沿当操台(池沿硌着腰被从后进入,下半身泡在热水里)/瓷砖地跪姿(膝盖垫着湿毛巾,打手围站一圈)/花洒水柱当道具(冲着敏感处固定)/镜墙(凛被迫看着雾气里自己被使用的轮廓)/泡沫当润滑陷阱(打滑=换姿势的天然借口)。\n专属感官:[视]蒸汽弥漫里肉体的轮廓/水面漂着泡沫与精液;[触]热水泡软的皮肤更敏感/瓷砖凉vs体温烫的交替/湿发贴在背上;[听]水声哗哗盖不住拍肉声与回声(浴场回声放大凛的❤,她越压抑越清楚);[嗅]皂香混着精臭与汗,蒸汽把气味蒸得更浓。\n必含节拍:①入浴即开始——"洗澡"从打手的手接管搓洗无缝滑入侵犯;②水中轮换——池沿/跪姿/花洒至少两种拓扑轮换,多人按空间排布(池里一个池沿一个,不硬塞);③洗净再弄脏循环——射完冲干净,下一个再来,"洗澡"永远洗不完;④泡到失神——热水+快感双重蒸腾,凛意识被泡软。\n词汇:L1热水/蒸汽/搓洗 → L2池沿硌腰/花洒抵着/泡沫滑进 → L3洗不完的精液/回声里全是自己的声音/泡到腿软捞不起来。\n【写法·浴场供奉专属】\n句式节奏:入浴滑入慢启(长句·"洗澡"从搓洗无缝滑入侵犯,标点疏·节奏被水声泡软)→拓扑轮换(池沿/跪姿/花洒切换是天然节奏断点,每换一拓扑节奏重启)→洗净弄脏循环(射完冲净=降速短句,下一个再来=节奏重启,形成"冲净-再弄脏"的无限循环感)→泡到失神收口(降速·热水+快感双重蒸腾,凛意识被泡软,长句拖尾)。张力在水与快感的双重蒸腾+回声放大,节奏被水声泡得绵软。\n感官侧重:听+触双主轴。听(水声哗哗盖不住拍肉声与回声·浴场回声放大凛的❤她越压抑越清楚)是浴场独家;触(热水泡软的皮肤更敏感/瓷砖凉vs体温烫交替/湿发贴背)次之;视(蒸汽弥漫里肉体轮廓/水面漂泡沫与精液)+嗅(皂香混精臭汗·蒸汽把气味蒸浓)并重。本玩法听觉的"回声放大"是核心独家 shame 源。\n词汇池(浴场专属温度轴):L1热水/蒸汽/搓洗→L2池沿硌腰/花洒抵着/泡沫滑进→L3洗不完的精液/回声里全是自己的声音/泡到腿软捞不起来。"回声里全是自己的声音"是浴场专属听觉羞耻源。\n体描写焦点:肤(热水泡软更敏感/瓷砖凉vs体温烫)·发(湿发贴背)·水中轮廓(蒸汽里被使用的肉体)。镜头利用水/蒸汽/镜墙做遮挡与暴露的切换,回声是隐性焦点。\n技法细节(从语料):①空间拓扑即灵魂——热水池沿当操台(池沿硌腰从后进入下半身泡水里)/瓷砖地跪姿(膝盖垫湿毛巾打手围站一圈)/花洒水柱当道具(冲敏感处固定)/镜墙(凛被迫看雾气里自己被使用的轮廓)/泡沫当润滑陷阱(打滑=换姿势借口),拓扑轮换是节奏断点;②搓洗滑入侵犯——"洗澡"从打手的手接管搓洗无缝滑入侵犯(侍奉的伪装);③回声放大——浴场回声放大凛的❤,她越压抑声音越清楚(独家听觉羞耻);④洗净弄脏循环——射完冲干净下一个再来,"洗澡"永远洗不完(循环即羞辱);⑤泡沫滑腻——泡沫当润滑/打滑换姿势,身体在泡沫里极度滑腻(对应人体海绵的零摩擦滑腻);⑥冷热交替——瓷砖凉vs体温烫的温差是触觉细节;⑦泡到失神——热水+快感双重蒸腾把凛意识泡软(节奏收口)。'}),on({id:'p_bath_serve_first',keys:['wb_bath_serve_first'],content:'浴场供奉·首次(里程碑·重点扩写)。\n落差核心:沐浴是凛最后一块"独处的私域"——大浴场建成那天她才明白,这浴场根本不是给她修的,是给"用她"修的。连洗澡这件事,都不再属于她自己。\n必含节拍:①新浴场初见——凛第一次走进气派的大浴场,短暂的错觉("九条会阔气了");②打手鱼贯而入——她还没反应过来,复数打手已经脱了进来,"伺候大小姐沐浴"说得理所当然;③接管——搓洗的手从背到胸到腿间,凛抓着池沿的手指发白;④首次浴场轮奸——按浴场拓扑(池沿/跪姿/ 室粗鲁占据她左右座位,同学全僵住但不敢问(骤变锚);②讲师装作没看见——讲师瞟一眼极道气场转身继续板书,凛意识到这里再也没人能护她(庇护所界限踏过);③课堂上被猥亵——左右打手开始动手(揉胸/伸进裙底/塞玩具抽插),凛必须维持上课姿态;④放学走出——校服被弄脏/腿软到走不稳,凛回头看校园门知道明天还是这样(收尾烙印);⑤B面延伸——学校彻底变成B面延伸区,大宅的边界已经吃到课堂里。'}),on({id:'p_school75',keys:['wb_school75'],content:'学校堕75·校内轮奸·忍声·常规。\n玩法/Tier: Tier2 校内多人轮奸+忍声(同 wb_multiplay_common 多人骨架)。\n设定: 打手要挟凛上学时也要配合解决性欲,同学因极道威慑不敢细究。\n子场景(随机·延续摘要记已用):\n  - 医务室: 拉床帘轮奸,外有望风打手以"大小姐不舒服需要休息"驱离师生。\n  - 体育仓库: 借口"开会",打手在器材堆里轮奸她。\n  - 空教室: 课间空教室拉窗帘里面轮。\n  - 男厕隔间: 占住男厕一隔间,不断有男生进来如厕,被打手义正词严劝退。\n核心要点(忍声): 凛为名声必须忍声,打手却故意刺激敏感点逼她出声/故意弄响动静。每次要么有惊无险无人发现,要么快被发现时望风打手强势拦走。\n词汇:L1医务室/体育仓库/隔间/望风→L2拉床帘/被按倒/嘴被堵/穴肉被刺激敏感点→L3差点叫出声/望风打手拦人/快感泄漏在校园里。\n爽点轴: 公开轮奸+强忍忘我 + 危机控制(差点被发现) + 校园神圣空间的亵渎。基调:高段词,轮奸打桩循环;拟声啪叽/咕叽,凛忍声的破碎❤。\n专属感官:[触]医务室床的硬/体育仓库器材的冰冷/男厕隔间的窄;[视]校园光透过床帘/被驱离的师生背影/凛维持表情的扭曲;[听]打手有意弄响的动静/快靠近的脚步声+望风打手出声拦的紧张/凛忍不住漏出的❤;[嗅]校园清洁剂vs精臭。\n结算: 首次→堕落度+。后续同范式,子场景按延续摘要轮换。\n【写法·学校轮奸档专属】\n句式节奏:忍声为主轴——拉门关上(短句·子场景空间封闭)→轮奸打桩循环(短句连发·拟声啪叽/咕叽·凛忍声的破碎❤)→危机打断(节奏被"快靠近的脚步声+望风打手出声拦"打断·有惊无险或快被发现时强势拦走)→整理回教室收口(降速·精液擦干校服整理好回教室继续上课同学装作没看出来)。基调高段词轮奸打桩循环,节奏被"忍声+危机控制"反复打断。\n感官侧重/词汇池:以忍声(凛为名声必须忍声,打手却故意刺激敏感点逼她出声/故意弄响动静) + 校园神圣空间亵渎为核心,听(打手有意弄响动静/快靠近脚步声+望风打手出声拦的紧张/凛忍不住漏出的❤)是危机主轴,嗅(校园清洁剂vs精臭)倒错。\n体描写焦点:嘴(被按住嘴或自己咬住制服袖口严密忍声)·脸(维持表情的扭曲)·空间(医务室床帘/体育仓库器材/空教室窗帘/男厕隔间的窄)。\n技法细节:①忍声核心——凛为名声必须忍声,打手却故意刺激敏感点逼她出声/故意弄响动静(核心张力);②望风系统——每次要么有惊无险无人发现,要么快被发现时望风打手强势拦走(危机控制);③子场景——医务室(拉床帘轮奸外有望风打手以"大小姐不舒服需要休息"驱离师生)/体育仓库(借口"开会"在器材堆里轮奸)/空教室(课间拉窗帘里面轮)/男厕隔间(占住一隔间不断有男生进来如厕被打手义正词严劝退);④校园神圣亵渎——校园神圣空间被亵渎(背德感);⑤忍声高潮——身体却不受控被这种禁忌感推到高潮(核心错乱);⑥整理回教室——精液擦干校服整理好回教室继续上课同学装作没看出(社死余韵)。'}),on({id:'p_school75_first',keys:['wb_school75_first'],content:'学校堕75·首次(里程碑·重点扩写)。\n落差核心: "上学还能保住贞操"的最后一点幻想破灭——校园里也开始被轮奸。\n必含节拍:①课间被叫走——打手以"大小姐有事"为名把她带去医务室/体育仓库;②拉门关上的瞬间——凛意识到这次不只是猥亵,五六个打手已围上来;③望风系统启动——一个打手在门外站岗,有师生靠近就被巧妙拦走,凛听见外面的对话强忍;④校内轮奸主体——凛被按住嘴或自己咬住制服袖口,严密忍声里被多根贯穿,但身体却不受控被这种禁忌感推到高潮;⑤被整理好回教室——精液擦干校服整理好,凛回到教室继续上课,同学装作没看出来。\n事后: 凛意识到大宅已经吞掉了学校。延续摘要记"已开学校NSFW(校内轮奸档)"+具体子场景。\n【写法·学校轮奸首次专属】\n句式节奏:课间被叫走慢启(长句·打手以"大小姐有事"为名把她带去医务室/体育仓库)→拉门关上骤变(短句·凛意识到这次不只是猥亵五六个打手已围上来)→望风系统启动(中速·一个打手门外站岗有师生靠近被巧妙拦走·凛听见外面对话强忍)→校内轮奸主体(短句连发·凛被按住嘴或自己咬住制服袖口·严密忍声里被多根贯穿·身体却不受控被禁忌感推到高潮)→整理回教室收口(降速·精液擦干校服整理好回教室继续上课同学装作没看出)。张力在"上学还能保住贞操"幻想破灭的首次认知塌陷。\n技法细节:①课间被叫走——打手以"大小姐有事"为名把她带去医务室/体育仓库(骤变前奏);②拉门关上瞬间——凛意识到这次不只是猥亵五六个打手已围上来(骤变锚·贞操幻想破灭);③望风系统——一个打手在门外站岗,有师生靠近就被巧妙拦走,凛听见外面的对话强忍(危机控制);④校内轮奸主体——凛被按住嘴或自己咬住制服袖口,严密忍声里被多根贯穿,但身体却不受控被这种禁忌感推到高潮(核心错乱);⑤整理回教室——精液擦干校服整理好凛回到教室继续上课,同学装作没看出来(社死余韵);⑥大宅吞校——凛意识到大宅已经吞掉了学校(收尾烙印)。'}),on({id:'p_violent_common',keys:['wb_violent_serve_common'],content:'【暴力供奉·铁律(痛→快感,丑恶不沉痛)】\n- 拒绝昏迷:任何重度环节,凛陷入迷离/休克边缘必立刻强制唤醒(冰水泼醒/扇脸/掐腿)拖回清醒继续承受。绝不写昏死/植物态/生命力丧失。阿黑颜翻白眼可以(意志崩溃,非生命危险)。\n- 强度修正:即便写"挂一小时""通电几百下",实际伤害锁死在临时等级——淤青/指痕/勒痕/红肿/酸胀/抽搐。数量是氛围不是伤害量。严禁推成破皮/撕裂/骨伤/永久损伤。\n- 允许痕迹:淤青/指痕/绳带勒痕/红肿/充血发亮/酸胀痉挛/过电余麻。全可逆(罗刹瞳血脉保证恢复)。\n- 禁止:破皮出血/撕裂/烧伤/脱臼/缺氧损伤/任何不可逆破坏。看着骇人,实则皮肉伤。\n- 痛→快感转译(本类灵魂·重点写这个):暴力供奉是受虐癖内容,不为勾起疼痛联想,而是演"痛怎么变成快感"。每场必须写清这条传导:①痛感袭来(钝痛/电击/勒压/呛憋)②身体本能的痛苦反应正在发生(绷紧/弹起/泪)③同一波神经刺激被身体错译成快感——痛点附近的穴肉不受控收缩分泌、敏感度被痛感放大到失控、凛明明该痛苦却感到一阵阵酥麻爽意涌上、她惊恐于身体的反应④疼与爽在同一具身体上搅成泥泞错乱,她分不清在受刑还是被开发,意志在这种错乱里被泡软。笔墨重心永远是"凛不由自主感到的快感",不是打手施加的暴力。\n- 痛→快感词汇三档(各场通用·防止写成纯疼痛):\n  ①痛感词(起手·点到为止,别堆): 钝痛/酸胀/灼/勒/麻/绷紧/泪涌——这些只是"开关",不是描写重心。\n  ②错译词(核心·重点堆这层): 酥麻/发软/穴肉不受控收缩/敏感到失控/痛得发抖却淌水/分不清疼还是爽/越痛越湿。\n  ③沦陷词(高潮): 痛爽搅成泥泞/在受刑里高潮/惊恐于自己的反应/意志被泡软/求更多。\n- 凛态度口吻(受虐癖推进):初期"为什么…不该是这样的…"(惊恐于身体)→中期"不要…那里…啊❤"(求饶混进媚叫)→沦陷"还要…"(受虐癖觉醒)。❤仅凛。\n- 打手口吻基调:享受地观察凛的反应、调侃她的身体诚实("看,它自己缩得多紧""嘴上说不要呢""大小姐这是爽的吧?"),不是冷酷施虐的沉默。\n- 触发:地下室升级解锁后,低忠诚自动触发 / 受虐癖高玩家主动选。'}),on({id:'p_violent_hang',keys:['wb_violent_hang'],content:'吊颈轮奸·常规。Tier2 悬吊束缚+车轮战(非真吊死,颈部变体悬吊)。\n机制: 手腕脚踝/腰带+颈圈分散受力,经滑轮吊上地下室天花板框架,身体空中呈X型或拉直悬空。重力是主施虐者——凛失去接地与支点,无法绷肌肉/挪重心抵御,像挂钩上的肉完全服从外力。颈圈承部分体重制造勒紧压迫与轻度缺氧眩晕(只取酥麻发飘,绝不取真窒息)。\n受力/痛→快感: 四肢吊点充血发紫发麻、颈圈勒红痕、躯干被拉长腰腹酸痛。皮肤拉到极紧无缓冲,插入/拍打比平时更剧烈直接。轻缺氧使敏感度飙升、视野发花、神经过载=痛→爽放大器。被插时身体空中无助旋转,每下借旋转惯性钻更深;发飘眩晕让她分不清窒息还是高潮,意识飘着下身在淌水。\n专属感官:[视]身体拉成扁长、腰塌陷、肋骨浮现;双腿分开吊起、阴阜拉平大阴唇外翻阴蒂顶出暴露全场;每挨一下转半圈正背面交替甩给围观。[触]皮肉绷紧灼痛/颈圈压迫/吊点胀麻/轻缺氧耳鸣发飘。[听]滑轮吱呀/颈圈咔哒/队列脚步喘/勒到变调的破碎齁叫(咕哦…噫噫)/缺氧接不连贯的嗬嗬抽气。\n多人(按拓扑·下身双插为主,不安嘴): 头部被悬吊受力、脖子被颈圈勒住→嘴这一路不安人(姿势与勒颈不支持)。可侵犯的是悬空下身:小穴+后穴被前后两根同时贯穿做主轴,两手各被掰开握一根。一组射完整组换下一组(双插组轮替),凛始终被下身双插不休息。借空中旋转做换组节奏点。\n爽点轴: 人数永动+控制危机(失重无助)+忘我丑态。基调:高段词,缺氧发飘前景化。\n禁忌: 颈部勒压只作发飘/敏感放大,绝不真断气不留缺氧后遗(用"眼前发花却觉下身越来越烫"替代任何快断气的沉重写法)。\n结算: 首次→堕落度+/受虐癖+;肉体次数累加;延续摘要记"已解锁吊颈轮奸"。\n【写法·吊颈轮奸专属】\n句式节奏:失重悬置慢启(长句·四肢吊点受力身体拉成X型·节奏被悬空拉长·标点疏)→缺氧发飘凝滞(颈圈勒紧那一刻节奏一停·一句拉长写发飘眩晕神经过载)→双插旋转(短句·借空中旋转惯性每下钻更深·拟声咕哦噫噫与嗬嗬抽气交错)→换组节奏点(整组射完整组换·旋转做换组断点)→错乱高潮收口(短句炸裂·分不清窒息眩晕还是被操到失神·意识飘着下身在淌水)。张力在失重无助+轻缺氧放大器,节奏被悬空与勒颈反复打断。\n感官侧重/词汇池:以轻缺氧发飘(视野发花/神经过载=痛→爽放大器)为核心,听(滑轮吱呀/颈圈咔哒/勒到变调破碎齁叫/缺氧嗬嗬抽气)是独家,触(皮肉绷紧灼痛/吊点胀麻)次之。L3缺氧发飘前景化。\n体描写焦点:身(拉成扁长/腰塌陷/肋骨浮现)·阴阜(拉平大阴唇外翻阴蒂顶出暴露全场)·每挨一下转半圈正背面交替甩给围观。\n技法细节:①悬吊分散受力——手腕脚踝/腰带+颈圈分散受力经滑轮吊上天花板,身体空中X型或拉直悬空(非真吊死,颈部变体悬吊);②重力是主施虐者——凛失去接地与支点无法绷肌肉/挪重心抵御,像挂钩上的肉完全服从外力;③颈圈取酥麻不取窒息——颈圈承部分体重制造勒紧压迫与轻度缺氧眩晕,只取酥麻发飘绝不真窒息(铁律);④轻缺氧放大器——缺氧使敏感度飙升/视野发花/神经过载=痛→爽放大器;⑤旋转借力——被插时身体空中无助旋转每下借旋转惯性钻更深;⑥发飘错乱——眩晕让她分不清窒息还是高潮意识飘着下身在淌水(核心错乱);⑦不安嘴——头部悬吊受力脖子勒住嘴这一路不安人,下身小穴+后穴前后两根贯穿主轴两手各握一根。'}),on({id:'p_violent_hang_first',keys:['wb_violent_hang_first'],content:'吊颈轮奸·首次(里程碑·重点扩写)。\n落差核心: 第一次发现"痛能让自己爽"——意志在痛爽错乱里被泡软。\n必含节拍:①被吊起的失重——四肢被绑/颈圈套上/滑轮拉起,凛第一次失去接地的恐慌;②首轮插入——空中无支点,身体被前后双插随旋转拖更深;③缺氧的恍惚——颈圈勒到发飘,意识开始模糊,凛惊恐于"为什么这种处境下身越来越烫";④痛爽错乱的高潮——分不清是窒息眩晕还是被操到失神,在受刑里高潮;⑤被放下时的脱力——脚回到地面那瞬反而支撑不住,凛察觉自己已经被某种东西改造了。\n事后: 凛第一次明白"原来痛能变成这种东西"——受虐癖的种子被埋下。延续摘要记"已解锁吊颈轮奸·首次受虐癖萌芽"。\n【写法·吊颈首次专属】\n句式节奏:被吊起失重慢启(长句·四肢被绑颈圈套上滑轮拉起·凛第一次失去接地的恐慌)→首轮插入(短句·空中无支点身体被前后双插随旋转拖更深)→缺氧恍惚凝滞(颈圈勒到发飘意识模糊·节奏一停·凛惊恐"为什么这种处境下身越来越烫")→痛爽错乱高潮(短句炸裂·分不清窒息眩晕还是被操到失神·在受刑里高潮)→被放下脱力收口(降速·脚回地面那瞬反而支撑不住·凛察觉自己已被某种东西改造)。张力在"痛能让自己爽"的首次认知塌陷,受虐癖萌芽。\n技法细节:①被吊起失重——四肢被绑颈圈套上滑轮拉起,凛第一次失去接地的恐慌(骤变锚);②首轮插入——空中无支点身体被前后双插随旋转拖更深;③缺氧恍惚——颈圈勒到发飘意识模糊,凛惊恐"为什么这种处境下身越来越烫"(核心错乱锚);④痛爽错乱高潮——分不清窒息眩晕还是被操到失神,在受刑里高潮;⑤被放下脱力——脚回地面那瞬反而支撑不住,凛察觉自己已被某种东西改造(受虐癖种子埋下)。'}),on({id:'p_violent_horse',keys:['wb_violent_horse'],content:'三角木马·常规。Tier2 骑乘式刑具。\n机制: 三角木马=顶部收成圆钝棱脊的三角柱体(剖面△/屋脊),凛被迫双腿大张跨坐其上、双脚悬空或极低固定。核心=把她自己体重变成刑具——下盘被棱强行劈开,失去并腿自保,会阴/阴唇/穴口/阴蒂直接骑压窄棱顶端,上半身体重全压下来,坐越久陷越深。"插入"两路:棱脊硬顶硌压 + 此姿态下前/后再用阴茎贯穿(门户大开易DP)。\n受力/痛→快感: 会阴软组织硬棱上挤压变形、臀肉推向两侧、大腿内侧韧带极限拉伸。纯重力钝痛(不用人动就深沉酸胀硌痛无法逃避)+二次冲击(她绷腿撑身想减痛,但撑久了腿一软绷不住,重重砸回棱上瞬间剧痛飙升——非体力不支,是被快感泡软了使不上力)。木马被前后推拉或她挨插扭动时,娇嫩粘膜在硬棱反复刮擦——粗暴碾压强刺激密集神经,穴口不受控涌透明蜜液,把纯物理痛搅成泥泞屈辱混强制快感的错乱(本场是"痛锚定快感"最直白机制)。\n专属感官:[视]被劈开的下盘/被棱挤向两侧外翻的肥厚屄唇/被顶出贴木棱的阴蒂/撑身绷出颤抖肌肉/蜜液顺棱往下淌反光。[触]深沉骨盆底硌痛酸胀/棱硬度/砸回的下坠剧痛/刮擦火辣。[听]撑身失败砸回闷响/棱面被淫液浸湿的黏腻水声/求饶齁叫。\n多人(按拓扑·下身被木马占,真人走口手与单穴): 凛骑棱脊上、下身被棱劈压占住——真人很难再从两个方向同时插入下身。下身"另一路"用玩具替代(棱脊旁绑振动棒/塞肛塞,与棱压叠加),或真人只从前方插小穴一路(后穴被坐姿+棱占用)。腾得出的口、双手由围站打手同时使用。换人是"换正在用口和下身那一路的人",棱脊始终在底下硌压。\n爽点轴: 控制(动弹不得)+痛爽错乱+物化。基调:中→高段,重力钝痛与刮擦交替。\n禁忌: 棱做钝压/硌痛/摩擦,绝不割伤压裂会阴(顶端设定圆钝棱非利刃,制造深沉酸胀而非破皮)。临时:会阴/腿内侧压红淤青;禁:软组织撕裂。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已解锁三角木马"。\n【写法·三角木马专属】\n句式节奏:跨坐沉陷慢启(长句·双腿大张跨坐棱脊双脚悬空·体重把她自己变成刑具·节奏被重力向下拉·标点沉)→钝痛硌压(中速·会阴软组织硬棱挤压·深沉酸胀无法逃避)→撑身失败砸回(短句炸裂——绷腿撑身想减痛撑久了腿一软绷不住重重砸回棱上瞬间剧痛飙升·非体力不支是被快感泡软使不上力·这是节奏的爆点)→刮擦搅乱收口(中速·娇嫩粘膜在硬棱反复刮擦·粗暴碾压密集神经·纯物理痛搅成泥泞屈辱混强制快感)。张力在"自己体重变成刑具"+"撑身失败砸回"的循环,节奏由重力与撑身失败交替。\n感官侧重/词汇池:以重力钝痛(深沉骨盆底硌痛酸胀无法逃避)+砸回下坠剧痛+刮擦火辣为核心,视(被劈开下盘/外翻肥厚屄唇/顶出贴棱阴蒂/蜜液顺棱淌反光),听(撑身失败砸回闷响/棱面淫液黏腻水声)。本场是"痛锚定快感"最直白机制。\n体描写焦点:下盘(被棱劈开/会阴软组织挤压变形)·阴阜(大阴唇外翻阴蒂顶出贴棱)·撑身肌肉(绷出颤抖/砸回)。\n技法细节:①自己体重变刑具——三角木马顶部圆钝棱脊,凛双腿大张跨坐双脚悬空,体重全压下来会阴/阴唇/穴口/阴蒂直接骑压窄棱顶端坐越久陷越深(核心机制);②失去并腿自保——下盘被棱强行劈开无法并腿自保;③纯重力钝痛——不用人动就深沉酸胀硌痛无法逃避;④撑身失败砸回(招牌节奏)——她绷腿撑身想减痛撑久了腿一软绷不住重重砸回棱上瞬间剧痛飙升,非体力不支是被快感泡软使不上力(节奏爆点);⑤粘膜刮擦——木马前后推拉或挨插扭动时娇嫩粘膜在硬棱反复刮擦,粗暴碾压密集神经,穴口不受控涌透明蜜液(痛锚定快感最直白);⑥棱旁玩具补——下身被棱占真人难再双插,棱脊旁绑振动棒/塞肛塞与棱压叠加,或真人只从前方插小穴一路;⑦圆钝非利刃——棱做钝压/硌痛/摩擦绝不割伤,顶端圆钝棱制造深沉酸胀非破皮(铁律)。'}),on({id:'p_violent_donkey',keys:['wb_violent_donkey'],content:'通电木驴·常规。Tier2 骑乘式+电击器+静态放置(放置play)。\n机制(去酷刑化,保留玩法): 底座立两根带震动/电极的桩柱,凛被吊放下来双穴(小穴+后穴)同时套上两桩、靠自身体重坐到底,双脚悬空或低位固定,长期固定。通电=电极在桩柱或贴臀,电流不经大脑直接激活肌肉。靠"双桩深插填满+周期电击+时间煎熬"三层叠加的慢性折磨,而非连续抽打。\n受力/痛→快感: 双桩借体重深插二穴填到极满的钝胀+电极处肌肉强制收缩。电流像成千上万根细针尖同时刺入毛孔顺神经游走、半边身瞬间麻痹;脉冲让肌肉跟节奏剧烈收缩,夹得二穴一阵阵绞紧两桩。电流酥麻与桩柱高频震动同源,穿透二穴粘膜共振,大腿不住颤抖、想绞紧又想张开缓解那过于集中的快感。电停后二穴持续痉挛、神经末梢余韵放电,长时间泡在敏感躁动里无意识收缩去含咬体内两桩。痛与酥麻在同一具身体上分不清是受刑还是被开发。\n专属感官:[视]肉浪翻滚——电流让臀部皮下肌肉群泛起肉眼可见波浪起伏,平滑臀面像水面被搅般凹凸翻滚;通电瞬间大腿猛弹/屁股突夹/脚趾死扣,二穴死咬两桩,像通电玩偶夸张僵硬一抽一抽。[触]双穴被深桩填满的钝胀/针刺密麻/热流体内乱窜/肌肉绷成石头/电停过电余麻。[听]电击器滋滋/马达嗡嗡/旋钮调频后身体一弹一软的即时同步/嗬嗬接不连贯抽气与变调甜腻鼻音。\n多人(按拓扑): 下身二穴已被两桩占满填实——真人走腾得出的口与双手(嘴含一根、两手各握一根),围站轮换;桩柱的电震持续轰二穴。也可换成真人接替桩柱亲自双插。电击让二穴非自主夹咬,被旁人当"她在主动迎合"羞辱。\n爽点轴: 时间煎熬+痛酥错乱+物化羞辱。基调:慢性折磨,余韵躁动。\n禁忌: 电击只取肌肉抽搐+针刺酥麻+肉浪的体表/浅层效果,严禁灼伤/心脏风险/电烧痕。临时:肌肉酸胀/过电余麻/会阴压红;禁:电烧/神经损伤。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已解锁通电木驴"。\n【写法·通电木驴专属】\n句式节奏:吊放套桩慢启(长句·双穴同时套上两桩靠自身体重坐到底双脚悬空·节奏被长期固定拉长)→双桩钝胀(中速·双桩深插填满二穴的钝胀·慢板煎熬)→电击脉冲(短句炸裂——电流像成千上万根细针尖同时刺入毛孔·脉冲让肌肉跟节奏剧烈收缩夹得二穴一阵阵绞紧两桩·节奏由电击脉冲控制)→余韵躁动收口(降速·电停后二穴持续痉挛神经末梢余韵放电·长时间泡在敏感躁动里无意识收缩去含咬两桩)。张力在"双桩填满+周期电击+时间煎熬"三层慢性折磨,节奏由电击脉冲驱动。\n感官侧重/词汇池:以电流针刺密麻+肌肉强制收缩+肉浪翻滚(电流让臀部皮下肌肉群泛起肉眼可见波浪起伏)为核心,听(电击器滋滋/马达嗡嗡/旋钮调频后身体一弹一软即时同步)是独家,触(双穴钝胀/针刺密麻/热流体内乱窜/肌肉绷成石头)。\n体描写焦点:臀(肉浪翻滚——皮下肌肉群波浪起伏凹凸翻滚)·二穴(死咬两桩/通电瞬间夸张僵硬一抽一抽)·大腿(猛弹/想绞紧又想张开缓解)。\n技法细节:①去酷刑化保留玩法——底座立两根带震动/电极桩柱,凛被吊放下来双穴同时套上两桩靠自身体重坐到底双脚悬空长期固定;②电流不经大脑——电极在桩柱或贴臀,电流不经大脑直接激活肌肉;③三层慢性折磨——双桩深插填满+周期电击+时间煎熬,非连续抽打;④针刺酥麻——电流像成千上万根细针尖同时刺入毛孔顺神经游走半边身瞬间麻痹;⑤脉冲绞紧——脉冲让肌肉跟节奏剧烈收缩夹得二穴一阵阵绞紧两桩,电流酥麻与桩柱高频震动同源穿透二穴粘膜共振;⑥肉浪翻滚——通电瞬间臀部皮下肌肉群泛起肉眼可见波浪起伏,大腿猛弹/屁股突夹/脚趾死扣二穴死咬两桩像通电玩偶夸张僵硬一抽一抽(视觉独家);⑦余韵放电——电停后二穴持续痉挛神经末梢余韵放电,长时间泡敏感躁动无意识收缩含咬两桩;⑧电击只取浅层——只取肌肉抽搐+针刺酥麻+肉浪的体表/浅层效果,严禁灼伤/心脏风险/电烧痕(铁律)。'}),on({id:'p_violent_water',keys:['wb_violent_water'],content:'水刑+轮奸·常规。Tier2 溺水窒息+轮奸(情色窒息play)。\n机制: 核心=制造"溺水/窒息"的同时被轮奸,凛双手反绑无法挣扎,只能扭身、踢腿、绷紧——用无力反抗带"虐"的联想,再由描写把"虐"转译成快感。三种窒息手法:①头被按进水盆/水槽里 ②脸上贴浸透水的毛巾 ③头套注水塑料袋。窒息与换气的节奏完全由打手掌控。\n情色挑战(本场专属): 打手定规矩——"插着的人射了才准她换一口气",否则让不让换气全看男人心情;凛为了那口气只能拼命用身体讨好、绞紧夹吸催他们快射,反而把自己送得更深。\n受力/痛→快感: 缺氧把全身敏感度放大到失控(同吊颈机制)——憋到眼前发花、肺里烧灼时,被插的穴却越来越烫越敏感,窒息边缘与高潮边缘重合;双手反绑、唯一能动的扭身踢腿在打手眼里成了"骚浪迎合";一口气被允许吸入的瞬间,缺氧的眩晕和高潮的痉挛一起炸开,她分不清是怕死还是爽到。她惊恐于自己在快淹死时还高潮。\n专属感官:[视]水中睁眼的气泡/浸水毛巾随呼吸一吸一贴的轮廓/塑料袋内壁雾水与她变形的痴脸/反绑双手攥紧又松开/踢腿溅起水花/被允许抬头时呛咳混着泪水口水往下淌。[触]水灌口鼻的呛、肺烧灼、太阳穴发胀、缺氧的轻飘、被插穴的烫与体内顶撞。[听]水里闷响的咕嘟/出水面的爆发性呛咳与抢气/塑料袋的窸窣/被按回水里前一声破碎的齁叫。\n多人(按拓扑·分体位): ①趴地头被按进水盆、撅臀——下身一般只容一个真人插一穴,另一穴用假阳具/玩具补双插。②脸贴浸水毛巾或套注水袋(头不按进水里)——头部自由,下身撅着空间足,可被前后两根真人双插夹击。两种都配双手反绑。换人在"她被允许换气"的间隙进行。\n爽点轴: 窒息边缘快感+无力挣扎(反绑)+控制生杀(换气权在男人手里)。基调:窒息张力与水声交错,憋—放节奏。\n禁忌(本场最严): 这是情色窒息play,不是真酷刑——绝不写真淹死/灌水进肺致伤/缺氧脑损伤/低体温伤害。每次窒息都有明确"放她换气"的节点。水保持干净,体液描写色情唯美。临时:呛咳/泡红/缺氧发飘;禁:溺水损伤。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已解锁水刑轮奸"。\n【写法·水刑轮奸专属】\n句式节奏:憋—放节奏(本玩法独家)——按进水/贴湿毛巾/套注水袋的窒息段(短句·咕嘟闷响·节奏被憋气压短)→被允许换气的瞬间(节奏骤放·爆发性呛咳抢气+缺氧眩晕与高潮痉挛一起炸开·短句炸裂)→再按回(节奏骤停·被按回水里前一声破碎齁叫)→循环。节奏完全由"插着的人射了才准换一口气"的规矩掌控,凛为那口气拼命用身体讨好催他们快射反而送得更深。\n感官侧重/词汇池:以缺氧放大失控(憋到眼前发花肺里烧灼时被插的穴越来越烫越敏感·窒息边缘与高潮边缘重合)为核心,听(水里闷响咕嘟/出水面爆发性呛咳抢气/塑料袋窸窣/被按回前破碎齁叫)是独家,视(水中睁眼气泡/浸水毛巾一吸一贴轮廓/塑料袋内壁雾水与变形痴脸)。\n体描写焦点:脸(水中睁眼/塑料袋内变形痴脸/被允许抬头时呛咳混泪水口水往下淌)·反绑手(攥紧又松开)·踢腿(溅水花的无力反抗)。\n技法细节:①情色窒息非真酷刑(铁律)——绝不写真淹死/灌水进肺致伤/缺氧脑损伤,每次窒息都有明确"放她换气"节点,水保持干净;②三种窒息手法——头按进水盆/脸贴浸透水毛巾/头套注水塑料袋,窒息与换气节奏由打手掌控;③换气规矩(核心)——"插着的人射了才准她换一口气",凛为那口气拼命用身体讨好绞紧夹吸催他们快射反而送得更深;④缺氧放大器——缺氧把全身敏感度放大到失控(同吊颈),窒息边缘与高潮边缘重合;⑤无力挣扎转译——双手反绑唯一能动的扭身踢腿在打手眼里成了"骚浪迎合";⑥换气炸开——一口气被允许吸入的瞬间缺氧眩晕和高潮痉挛一起炸开,她分不清怕死还是爽到,惊恐于自己在快淹死时还高潮;⑦分体位拓扑——趴地头按水盆撅臀(下身只容一穴真人另一穴玩具补)/脸贴毛巾或套袋头不进水(头部自由下身撅着可前后真人双插),换人在"被允许换气"间隙。'}),on({id:'p_violent_cane',keys:['wb_violent_cane'],content:'杖笞调教·常规(笞刑架)。Tier2 笞刑五阶段渐进+刑架姿势+打后轮奸。语料:「杖刑」五阶段+「刑架趴式」「悬吊式」「尿布式拘束」。\n五阶段渐进(核心·绝不开场写满,反应从忍耐过渡到哭闹):\n  ①宣笞: 蘸水空心竹片打臀峰——不痛但响亮"啪"溅水花,纯心理惊吓,白嫩臀肉泛淡粉;\n  ②预笞: 软皮拍左右高速连抽热身,粉红转均匀大红、发烫发麻;\n  ③板笞: 宽厚木板"压下半寸顺势弹起",血憋在肉里,充血肿高、浮出深红绛紫淤块;此段塞橡胶口球(惨叫闷成呜咽);\n  ④藤笞: 浸水老藤撤口球,细受力面抽裂肿肉把淤血抽出来,一笞一痕;\n  ⑤终段: 打到"烂桃色"收——按刑架姿势就地轮奸,打手挺进时每次撞在肿烫的臀肉上都激出加倍的呻吟。\n刑架姿势(选其一为主轴): 大字悬吊展露(手吊顶端脚拷支架·木枕顶腹臀部后撅)/倒V跪趴(上身卡进木架孔洞锁死·臀成最高点)/尿布式拘束(仰躺双腿高抬分固·全无死角)。\n受力/痛→快感: 挨打时臀肉的烫与肿让事后的每次贯穿都被放大;藤痕被打手的腰腹擦过时痛与快感在同一寸皮肤上打架;凛惊恐于"被打肿的地方被顶到反而叫得最甜"。\n专属感官:[视]臀色渐变(白→粉→大红→绛紫→烂桃)/藤条抽下时肉浪翻滚/汗水流过痕迹;[听]竹片脆啪/木板闷噗/藤条咻—啪/口球后的呜咽;[触]发烫肿胀的钝痛/藤痕的锐痛/打手撞上肿肉的炸裂感。\n禁忌: 现行规则——看着骇人实则皮肉伤;拒绝昏迷(中途泼水/提神香保持清醒);打完仍能哭能爬能颤抖。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开杖笞"。\n【写法·杖笞专属】\n句式节奏:五阶段渐进(绝不开场写满·反应从忍耐过渡到哭闹)——①宣笞(短句·蘸水竹片打臀峰不痛但响亮啪溅水花·纯心理惊吓)→②预笞(中速·软皮拍左右高速连抽热身·粉转大红发烫发麻)→③板笞(短句闷重·宽厚木板压下半寸顺势弹起·血憋肉里充血肿高浮淤块·此段塞口球惨叫闷成呜咽)→④藤笞(短句锐利·浸水老藤撤口球·细受力面抽裂肿肉把淤血抽出来一笞一痕)→⑤终段(中速·打到烂桃色收·就刑架姿势就地轮奸·打手挺进每次撞肿烫臀肉激出加倍呻吟)。节奏由五阶段工具的音色与力度递进决定。\n感官侧重/词汇池:以臀色渐变(白→粉→大红→绛紫→烂桃)为视觉主轴,听(竹片脆啪/木板闷噗/藤条咻—啪/口球后呜咽)是阶段标志,触(发烫肿胀钝痛/藤痕锐痛/打手撞上肿肉炸裂感)。\n体描写焦点:臀(臀色渐变/藤条抽下肉浪翻滚/肿高浮淤)·脸(从放狠话→压抑闷哼→带哭腔惨叫→生理泪水口水失控)。\n技法细节:①五阶段渐进(核心·绝不开场写满)——宣笞(蘸水竹片不痛但响亮心理惊吓)→预笞(软皮拍热身粉转大红)→板笞(宽厚木板压下半寸弹起充血肿高浮淤块·塞口球)→藤笞(浸水老藤撤口球细受力面抽裂肿肉一笞一痕)→终段(烂桃色收就刑架轮奸);②刑架姿势(选一)——大字悬吊展露/倒V跪趴(上身卡木架孔洞锁死臀成最高点)/尿布式拘束(仰躺双腿高抬分固全无死角);③打后放大——臀肉烫与肿让事后每次贯穿被放大,藤痕被打手腰腹擦过时痛与快感在同一寸皮肤打架;④错乱锚——凛惊恐"被打肿的地方被顶到反而叫得最甜";⑤拒绝昏迷——中途泼水/提神香保持清醒,打完仍能哭能爬能颤抖(铁律)。'}),on({id:'p_violent_cane_first',keys:['wb_violent_cane_first'],content:'杖笞调教·首次(里程碑·重点扩写)。语料:「杖刑(简洁)」。\n落差核心: 极道千金被按上自家地下室的刑架——"家法"两个字从她管人变成管她。\n必含节拍:①上架——被拷上刑架摆成悬吊展露式,内裤褪下挂在刑架上"展示",她还在放狠话;②宣笞的心理战——蘸水竹片一声脆响,不痛,但她瞬间绷紧的反应引来哄笑;③渐进的失守——皮拍到木板,狠话变成压抑闷哼再变成带哭腔的惨叫,口球塞入;④藤笞的顶点——老藤抽上肿透的臀肉,生理泪水口水全失控;⑤打完就上——就着刑架姿势被轮奸,肿烫的臀肉被撞得她又痛又爽,分不清叫声是哪种。\n事后: 趴在刑架上下不来,身后一片烂桃色——她第一次真切知道了"受虐"这两个字会在自己身上开花。延续摘要记"首次杖笞·受虐癖开发推进"。\n【写法·杖笞首次专属】\n句式节奏:上架放狠话慢启(长句·被拷上刑架悬吊展露式内裤褪下挂刑架展示·她还在放狠话)→宣笞心理战骤变(短句·蘸水竹片一声脆响不痛但她瞬间绷紧的反应引来哄笑)→渐进失守(节奏从狠话→压抑闷哼→带哭腔惨叫·口球塞入)→藤笞顶点(短句锐利·老藤抽上肿透臀肉·生理泪水口水全失控)→打完就上收口(中速·就刑架姿势被轮奸·肿烫臀肉被撞又痛又爽分不清叫声是哪种)。张力在"家法从管人变成管她"的首次认知塌陷。\n技法细节:①上架放狠话——被拷上刑架摆成悬吊展露式内裤褪下挂刑架"展示",她还在放狠话(舒缓反差);②宣笞心理战——蘸水竹片一声脆响不痛但她瞬间绷紧的反应引来哄笑(骤变锚·心理惊吓);③渐进失守——皮拍到木板狠话变压抑闷哼再变带哭腔惨叫口球塞入(反应过渡);④藤笞顶点——老藤抽上肿透的臀肉生理泪水口水全失控(强度顶点);⑤打完就上——就着刑架姿势被轮奸,肿烫的臀肉被撞得她又痛又爽分不清叫声是哪种(核心错乱);⑥家法倒转——"家法"两个字从她管人变成管她,趴刑架上下不来身后烂桃色,第一次真切知道"受虐"会在自己身上开花(收尾烙印)。'}),on({id:'p_violent_latex',keys:['wb_violent_latex'],content:'胶衣调教·常规(拘束衣柜)。Tier2 乳胶真空包裹+感官剥夺+鞭打轮奸。语料:「紧身胶衣/皮衣」+「眼罩」+「嘴塞」。\n装备三件套:\n  ①乳胶胶衣: 第二层皮肤般死死吸附(内绝不许穿内裤),臀肉被勒出深缝;体温锁死,汗水积在皮肤与胶衣之间——她整个人泡在自己温热黏腻的汗里,黑色表面反着冰冷淫光;\n  ②眼罩: 视觉剥夺→听觉触觉代偿放大。工具破空的咻声、皮带折叠的啪嗒、脚步声全被无限放大;落点不可预测,每次疼痛在意想不到的位置炸开,惊吓翻倍;施罚间隙的停顿比挨打更磨人;\n  ③嘴塞: 惨叫闷成动物般呜咽,口水顺着撑开的嘴角淌到锁骨。\n玩法节奏: 隔胶衣鞭打(乳胶上的抽打是气球爆裂般尖锐的"啪—",汗水润滑下布料在皮肤上滑动)→裆部双向拉链只拉开一段(黑壳里剥出一块滚烫白肉·周围全是冰冷乳胶,中间毫无防备)→就着拉链开口轮奸,她全程看不见是谁、只能靠气味和顶撞节奏猜。\n受力/痛→快感: 看不见的等待把每一次接触都放大;闷热潮湿的封闭环境无限放大焦躁与羞耻;拉链开口处的皮肤敏感到指尖擦过都打颤。\n专属感官:[视]黑胶反光在扭动中游走/拉链银线/开口弹出的白;[听]爆裂啪—/吱嘎摩擦/眼罩下粗重的鼻息;[触]内部汗液的黏腻游动/开口内外的冰热反差。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开胶衣调教"。\n【写法·胶衣调教专属】\n句式节奏:真空包裹慢启(长句·乳胶胶衣死死吸附体温锁死汗积皮肤与胶衣之间·节奏被封闭闷罐拉长)→感官剥夺等待(节奏凝滞——视觉剥夺后听觉触觉代偿放大·工具破空咻声/皮带折叠啪嗒/脚步声无限放大·落点不可预测·施罚间隙的停顿比挨打更磨人·这是节奏的悬置段)→隔胶鞭打(短句·乳胶上抽打是气球爆裂般尖锐啪—·汗水润滑下布料在皮肤滑动)→拉链开口轮奸(中速·裆部双向拉链只拉开一段·黑壳里剥出滚烫白肉·就开口轮奸她全程看不见是谁只能靠气味和顶撞节奏猜)。张力在感官剥夺下的未知等待+闷热封闭放大焦躁。\n感官侧重/词汇池:以视觉剥夺后听觉触觉代偿放大(工具破空声/脚步声无限放大·落点不可预测)为核心,触(内部汗液黏腻游动/开口内外冰热反差)是独家,听(爆裂啪—/吱嘎摩擦/眼罩下粗重鼻息)。\n体描写焦点:胶衣(黑胶反光在扭动中游走/拉链银线/开口弹出的白)·闷罐(体温锁死汗积·整个人泡自己温热黏腻汗里)。\n技法细节:①乳胶第二层皮肤——胶衣死死吸附(内绝不许穿内裤)臀肉被勒出深缝,体温锁死汗水积在皮肤与胶衣之间,她整个人泡在自己温热黏腻的汗里黑胶表面反冰冷淫光;②眼罩剥夺——视觉剥夺→听觉触觉代偿放大,工具破空咻声/皮带折叠啪嗒/脚步声全被无限放大,落点不可预测每次疼痛在意想不到位置炸开惊吓翻倍;③停顿比挨打更磨人——施罚间隙的停顿比挨打更磨人(节奏悬置);④嘴塞——惨叫闷成动物般呜咽口水顺撑开的嘴角淌到锁骨;⑤隔胶鞭打——乳胶上抽打是气球爆裂般尖锐啪—,汗水润滑下布料在皮肤滑动;⑥拉链开口(招牌)——裆部双向拉链只拉开一段,黑壳里剥出一块滚烫白肉周围全是冰冷乳胶中间毫无防备,就拉链开口轮奸她全程看不见是谁只能靠气味和顶撞节奏猜;⑦开口敏感——拉链开口处皮肤敏感到指尖擦过都打颤。'}),on({id:'p_violent_ginger',keys:['wb_violent_ginger'],content:'粘膜灼烧调教·常规(灼烧药剂:辣椒油/鲜姜汁涂抹+削姜塞入)。Tier2 化学灼烧+异物滞留+夹姜轮奸。语料:「姜罚刑」全篇+「液体刺激刑」。\n修整仪式(嗅觉威慑·必写): 当着凛的面削老姜——去皮、削成塞型、刻出螺旋深痕(多渗汁),黄汁顺刀刃滴落;辛辣气味弥漫,她鼻腔发痒眼睛流泪,插入前就开始战栗。\n痛觉演化(利用生理时间差·分段写):\n  ①潜伏: 姜块抵穴口画圈,只有冰凉滑腻——"也许不会很痛"的错觉,但鼻端辛辣一直在提醒;\n  ②初燃: 30秒后凉意褪去泛温热,像贴了暖宝宝,括约肌不自觉轻收;\n  ③针刺: 热度升级成密集刺痛,她开始扭动,越夹紧越把汁挤进褶皱,刺激面越大;\n  ④燎原: 纯粹持续的灼烧,夹紧没用放松没用扭动没用——"无处可逃"是核心;体液大量分泌想冲刷,反而成了助燃剂淌到腿根。\n夹姜轮奸(本装置招牌): 姜块塞后庭、真人从小穴进入(或反之)——打手每次挺进都隔着薄壁挤压姜块,榨出新汁引发新一轮灼烧;括约肌痉挛的"吞吐"在打手感知里成了极品的绞紧;她被烧得发狂的扭腰在外人眼里全是骚浪迎合。\n取出余韵: "波"的一声取出后灼烧仍持续数小时;穴口深红肿胀一时无法闭合,随呼吸微颤。\n禁忌: 化学刺激是黏膜灼热感,无实质组织损伤;现行规则不变。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开姜罚"。\n【写法·姜罚专属】\n句式节奏:修整仪式嗅觉威慑慢启(长句·当面削老姜去皮削成塞型刻螺旋深痕·黄汁顺刀刃滴落·辛辣气味弥漫她鼻痒眼流泪·插入前就开始战栗·节奏被削姜动作拉长)→痛觉演化四段(利用生理时间差)——①潜伏(短句·姜块抵穴口画圈只有冰凉滑腻·"也许不会很痛"的错觉)→②初燃(中速·30秒后凉意褪去泛温热像暖宝宝·括约肌不自觉轻收)→③针刺(短句·热度升级成密集刺痛她开始扭动·越夹紧越把汁挤进褶皱刺激面越大)→④燎原(短句连发·纯粹持续灼烧夹紧没用放松没用扭动没用·"无处可逃"是核心·体液大量分泌想冲刷反而成助燃剂淌到腿根)→夹姜轮奸收口(中速·打手每次挺进都隔薄壁挤压姜块榨新汁引发新一轮灼烧)。节奏由姜汁灼烧的时间差演化驱动。\n感官侧重/词汇池:以化学灼烧(粘膜灼热感·利用生理时间差的潜伏/初燃/针刺/燎原四段)为核心,嗅(当面削姜辛辣气味弥漫·鼻痒眼流泪)是独家前瞻,触(冰凉滑腻→温热→密集刺痛→持续灼烧)是演化主轴。\n体描写焦点:穴口(姜块抵穴口画圈→灼烧深红肿胀一时无法闭合随呼吸微颤)·脸(战栗/鼻痒眼流泪)·扭腰(被烧得发狂的扭腰在外人眼里全是骚浪迎合)。\n技法细节:①修整仪式(嗅觉威慑·必写)——当面削老姜去皮削成塞型刻螺旋深痕(多渗汁)黄汁顺刀刃滴落,辛辣气味弥漫她鼻腔发痒眼睛流泪,插入前就开始战栗;②痛觉演化四段(利用生理时间差·核心)——潜伏(冰凉滑腻错觉)→初燃(30秒后泛温热括约肌轻收)→针刺(密集刺痛越夹紧越挤汁进褶皱)→燎原(持续灼烧无处可逃体液分泌成助燃剂);③夹姜轮奸(招牌)——姜块塞后庭真人从小穴进入(或反之),打手每次挺进都隔薄壁挤压姜块榨新汁引发新一轮灼烧,括约肌痉挛的"吞吐"在打手感知里成了极品绞紧;④扭腰错译——她被烧得发狂的扭腰在外人眼里全是骚浪迎合(核心错乱);⑤取出余韵——"波"的一声取出后灼烧仍持续数小时,穴口深红肿胀一时无法闭合随呼吸微颤;⑥化学刺激无实质损伤——粘膜灼热感无实质组织损伤(铁律)。'}),on({id:'p_violent_wax',keys:['wb_violent_wax'],content:'温度调教·常规(炙香与蜡烛)。Tier2 缓燃高温点+滴蜡覆壳+冷热交替轮奸。语料:「炙香」+「低温蜡烛」。\n炙香(等待的恐惧·主轴一): 点燃的草药小圆柱排着摆上绑定的臀肉——放上时只是微热,火星缓慢向下烧,她全程知道热点在一毫米一毫米逼近皮肉却动弹不得;臀肉不受控地哆嗦打颤,被烫处泛起深红圆印;胸口摆放时她只能眼睁睁看着那点红光在自己身上烧。\n滴蜡(覆壳与拉扯·主轴二): 低温蜡烛悬在上方,蜡油无规律滴落——砸下的瞬间身体猛弹、短促惊呼;冷却凝固成壳扒住皮肤,越积越多;她稍一扭动,凝固蜡块就拉扯皮肉,又痛又痒;乳尖被一层层封进蜡里,施罚的手再揉上去,干硬蜡块摩擦嫩肉催出扭曲的快感。\n冷热交替与轮奸: 泼凉水激醒→继续滴蜡;蜡壳覆体状态下轮奸——打手的体温、蜡壳的硬、被烫处的灼,三种温度在同一具身体上乱撞;每次顶撞震裂几块蜡壳剥落,露出底下烫红的印。\n私处滴蜡(高潮段): 蜡油滴在湿润穴口,遇淫水半凝成又热又硬的壳,堵住的异物感+烫红的嫩肉让她彻底慌乱,泥泞与蜡泪混在一起。\n禁忌: 低温蜡专用/炙香点到即止——临时红印,无灼伤;现行规则不变。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开温度调教"。\n【写法·温度调教专属】\n句式节奏:双主轴交替——炙香(等待的恐惧·长句·点燃草药小圆柱排上臀肉·放上时微热火星缓慢向下烧·她全程知道热点一毫米一毫米逼近皮肉却动弹不得·节奏被缓慢逼近拉长·臀肉不受控哆嗦打颤)↔滴蜡(覆壳与拉扯·短句——蜡油无规律滴落砸下瞬间身体猛弹短促惊呼·冷却凝固成壳扒住皮肤·她稍扭动凝固蜡块拉扯皮肉又痛又痒)。冷热交替(短句·泼凉水激醒→继续滴蜡·冷热节奏切断)→蜡壳覆体轮奸收口(中速·打手体温+蜡壳硬+被烫处灼三种温度在同一具身体乱撞·每次顶撞震裂几块蜡壳剥落露出烫红印)。\n感官侧重/词汇池:以温度乱撞(打手体温/蜡壳硬/被烫处灼三种温度同身) + 等待的恐惧(热点一毫米逼近却动弹不得)为核心,视(臀肉深红圆印/蜡壳覆体/震裂蜡块剥落露烫红印)。\n体描写焦点:臀(炙香深红圆印/哆嗦打颤)·乳尖(被一层层封进蜡里·施罚手揉上去干硬蜡块摩擦嫩肉催出扭曲快感)·穴口(高潮段蜡油滴湿润穴口遇淫水半凝成又热又硬壳·堵住异物感+烫红嫩肉)。\n技法细节:①炙香(等待的恐惧·主轴一)——点燃草药小圆柱排上绑定臀肉,放上时微热火星缓慢向下烧,她全程知道热点一毫米一毫米逼近皮肉却动弹不得,臀肉不受控哆嗦打颤被烫处泛深红圆印;②滴蜡(覆壳与拉扯·主轴二)——低温蜡烛悬上方蜡油无规律滴落,砸下瞬间身体猛弹短促惊呼,冷却凝固成壳扒住皮肤,她稍扭动凝固蜡块拉扯皮肉又痛又痒;③乳尖封蜡——乳尖被一层层封进蜡里,施罚的手再揉上去干硬蜡块摩擦嫩肉催出扭曲快感;④冷热交替——泼凉水激醒→继续滴蜡,蜡壳覆体状态下轮奸,打手体温/蜡壳硬/被烫处灼三种温度在同一具身体乱撞,每次顶撞震裂几块蜡壳剥落露出底下烫红的印;⑤私处滴蜡(高潮段)——蜡油滴在湿润穴口遇淫水半凝成又热又硬的壳,堵住的异物感+烫红的嫩肉让她彻底慌乱,泥泞与蜡泪混在一起;⑥低温蜡专用——炙香点到即止,临时红印无灼伤(铁律)。'}),on({id:'p_multiplay',keys:['wb_multiplay_common'],content:'多人轮奸通用写作要点。\n镜头权重:笔墨永远砸在"正在被最激烈使用的那个部位",镜头跟着走;围观/等待的雄性压到画面最边缘,提一句存在就够。\n感官过载=核心爽点:写"同时"——前面被顶深度、后面节奏、嘴里塞满呼吸受阻,多路信号交错涌入同一具身体。\n两个接两个(默认追求·但服从拓扑):多人色情默认倾向"同时被多根使用"(下身双穴同时贯穿+嘴/手分配),换人优先"整组换"而非单根轮替。必须符合空间拓扑:先判姿势腾得出哪些孔给真人,腾不出的孔用玩具替代或不硬塞。绝不无视姿势硬凑人数。\n换组=节奏断点:利用换组间隙写身体状态(精液外涌/肌肉痉挛/余麻/缺氧发飘),写拔出吸力感+下一组同时插入的新鲜冲击。\n快感重心:无论多少人多少花样,笔墨重心永远是"凛被同时填满/同时刺激时不受控涌上的快感"。\n意志曲线:多人场景恶堕加速(身体多方受攻意志崩得快),但有拉锯不一轮就崩。走"嘴上不要身体已迎合→求与抗交替→主动求种"三阶。注:崩的是意志不是体力(罗刹瞳无体力不支)。\n规模模糊化:不写精确数字,用"排着来/换了不知多少茬/记不清"传达扩张感。\n多雄区分:体型/屌特征/气味/使用风格(粗暴打桩vs慢磨vs故意折磨)区分,节奏差异本身是刺激源。'}),on({id:'p_forced_leave',keys:['wb_forced_leave'],content:'白日供奉·白日宣淫(常规)。物件化型·激活口吻④。\n场景本质:全体打手把"今天不用上班"变成"今天把大小姐用一整天"。凛被作为白天活动的道具/表演/背景板,不耽误打手吃饭打牌谈事,随时随手。\n必含节拍:①活动背景化——打手在做别的事(打牌/吃饭/看球),凛被架在某个位置持续使用,活动照旧。②随手亵玩——经过的人顺手插几下,开完会的人换上来,完全不打断节奏。③长程饱和——一整天的高强度供奉(时间线绵延);午间、餐后、傍晚各有节点。④意识模糊——超长时程快感累积,意志崩得比单夜更彻底。\n白日宣淫特色词汇:L1白天/活动/打牌 → L2体内流动精液/保持插着/被当椅子靠垫用 → L3记不清来了多少人/脑子只剩被顶/高潮连着高潮分不清。\n打手口吻④:"这个角度真好用""今天当桌子用""别管她,继续打牌""等会儿轮到我""来,开完会继续"。\n凛体焦点:被迫长时间保持的羞耻体位/精液持续涌出无法收拾/全程保持半清醒的失控感。\n【写法·白日供奉专属】\n句式节奏:长程饱和为主轴——活动背景化(长句·打手做别的事打牌/吃饭/看球凛被架某位置持续使用活动照旧·节奏被日常活动主导)→随手亵玩(短句·经过的人顺手插几下开完会的人换上来完全不打断节奏·节奏无缝不间断)→长程饱和(时间线绵延·午间/餐后/傍晚各节点·长时段)→意识模糊收口(降速·超长时程快感累积意志崩得比单夜更彻底)。节奏全天绵延不断绝,与单夜供奉的"一晚一茬"区别在时程极长。\n感官侧重/词汇池:以物件化(凛是道具/表演/背景板·不耽误打手活动)+长程饱和(一整天高强度·精液持续涌出无法收拾)为核心,触(被迫长时间保持的羞耻体位),听(活动背景音打牌/吃饭/看球与凛压不住的❤交错)。\n体描写焦点:体位(被迫长时间保持)·精液(持续涌出无法收拾)·半清醒(全程保持半清醒失控感)。\n技法细节:①活动背景化(核心)——打手在做别的事(打牌/吃饭/看球)凛被架某位置持续使用活动照旧,凛是道具不是人;②随手亵玩——经过的人顺手插几下开完会的人换上来完全不打断节奏(无缝不间断);③长程饱和——一整天高强度供奉时间线绵延,午间/餐后/傍晚各有节点(时程极长);④意识模糊——超长时程快感累积意志崩得比单夜更彻底(核心错乱);⑤物件化口吻④——"这个角度真好用/今天当桌子用/别管她继续打牌/等会儿轮到我/来开完会继续"(道具化);⑥精液无法收拾——精液持续涌出全天无法收拾(长程标志)。'}),on({id:'p_forced_leave_first',keys:['wb_forced_leave_first'],content:'白日供奉·首次(里程碑·重点扩写)。\n落差核心:第一次意识到自己连"下班"的权利都没有——打手把她的一整天当成福利日。\n必含节拍:①通知那一刻——"大小姐今天别出去了"这句话的冷静随意,比任何恶语更能击穿。②被安置——摆成某个方便使用的体位,活动在她周围开始,她是道具不是人。③午间清醒——中途某刻短暂清醒,意识到这将是漫长的一整天;然后被插回去继续。④日落收尾——天黑时精液淌遍身体,意识已经泡碎。\n事后:凛无法用"昨晚的供奉"来框定这种事——这是白天,是本该属于她支配的时间。延续摘要:记"首次白日供奉·全天"。\n【写法·白日供奉首次专属】\n句式节奏:通知那一刻冷启(长句·"大小姐今天别出去了"的冷静随意比任何恶语更击穿)→被安置(短句·摆成方便使用的体位活动在她周围开始她是道具不是人)→午间清醒凝滞(节奏一停·中途某刻短暂清醒意识到这将是漫长的一整天·然后被插回去继续)→日落收口(降速·天黑时精液淌遍身体意识已经泡碎)。张力在"连下班权利都没有·白天本该她支配的时间被当福利日"的首次认知塌陷。\n技法细节:①通知那一刻——"大小姐今天别出去了"的冷静随意比任何恶语更击穿(骤变锚·冷静随意击穿);②被安置——摆成某个方便使用的体位活动在她周围开始,她是道具不是人(物件化);③午间清醒——中途某刻短暂清醒意识到这将是漫长的一整天,然后被插回去继续(核心错乱:清醒意识到漫长再被插回);④日落收尾——天黑时精液淌遍身体意识已经泡碎(长程饱和烙印);⑤白天失守——凛无法用"昨晚的供奉"框定这种事,这是白天本该属于她支配的时间(收尾烙印:白天支配权失守)。'}),on({id:'p_daily_erosion',keys:['wb_daily_erosion'],content:'身体擅自发情·A4白天突发(常规)。核心=身体先于意志背叛:被开发到阈值的部位在白天的正常时段擅自苏醒,凛的意志还在抵抗/羞耻,身体已经自己找上打手。\n场景起手(按当时情境选一):白天办事途中双腿突然发软夹紧/开会听报告时被开发过的部位空虚到无法集中/走廊擦肩某个打手时身体自己停住/端茶的手抖到洒出来。\n必含节拍:①症状发作——具体部位的具体反应(口腔:无意识吞咽舔唇;小穴:湿透内裤顺腿流;肛门:坐立不安夹紧;)凛试图用意志压制;②压制失败——生理反应升级到旁人可见(潮红/喘息/腿软),她越用力端着越明显;③打手察觉——附近打手看出来了,从试探到直接上手,凛的拒绝毫无说服力(身体在迎合);④白天就地解决——在当时所在场所被使用,重点写"意志说不要、身体自己动"的分裂感;⑤事后余韵——解决完身体安分了,凛整理仪容,对"身体已经不归自己管"的事实多一分绝望认知。\n词汇温度:L1腿软/走神/夹紧 → L2内裤湿透/身体自己贴上去/腰自己摆 → L3意志和身体彻底两层皮/被自己的穴背叛/白天就被操到失神。\n凛体焦点:发情部位的具体生理细节(按触发部位写)/端着的表情与失控的身体同框/事后异样的安分。\n结算:A4隐瞒判定(成功=极道威望·打手内部消化;失败=被外人撞见,极道威望转淫名+忠诚)。\n【写法·身体擅自发情专属】\n句式节奏:症状发作慢启(长句·白天正常时段某被开发部位突然空虚酸软·凛试图用意志压制·节奏被生理反应打断)→压制失败(中速·生理反应升级到旁人可见潮红/喘息/腿软·她越用力端着越明显)→打手察觉(短句·附近打手看出从试探到直接上手·凛的拒绝毫无说服力因身体在迎合)→白天就地解决(短句连发·重点写"意志说不要身体自己动"的分裂感)→事后余韵收口(降速·解决完身体安分凛整理仪容·对"身体已不归自己管"多一分绝望)。张力在"身体先于意志背叛"的分裂,节奏被生理自发反应驱动。\n感官侧重/词汇池:以"意志与身体两层皮"(被自己的穴背叛/白天就被操到失神)为核心,按触发部位写具体生理(口腔无意识吞咽舔唇/小穴湿透内裤顺腿流/肛门坐立不安夹紧)。\n体描写焦点:发情部位具体生理细节·端着的表情与失控身体同框·事后异样安分。\n技法细节:①身体先于意志背叛(核心)——被开发到阈值的部位在白天正常时段擅自苏醒,凛意志还在抵抗/羞耻身体已经自己找上打手;②场景起手——白天办事途中双腿突然发软夹紧/开会听报告时被开发部位空虚到无法集中/走廊擦肩某个打手时身体自己停住/端茶的手抖到洒出;③症状按部位——口腔无意识吞咽舔唇/小穴湿透内裤顺腿流/肛门坐立不安夹紧;④压制失败——生理反应升级到旁人可见,越用力端着越明显;⑤拒绝无说服力——打手察觉从试探到直接上手,凛的拒绝毫无说服力(身体在迎合);⑥分裂感——重点写"意志说不要、身体自己动";⑦事后认知——对"身体已经不归自己管"多一分绝望。'}),on({id:'p_daily_erosion_first',keys:['wb_daily_erosion_first'],content:'身体擅自发情·首次(里程碑·重点扩写)。\n落差核心:此前所有的堕落都发生在"被安排的时间"(夜晚供奉/事件),这是第一次——没有任何人碰她,她的身体自己在白天发情了。这意味着堕落已经不是外部强加,而是长进了身体里。\n必含节拍:①毫无预兆——白天最寻常的时刻(看账本/喝茶/训话),某个被开发过的部位突然空虚酸软;②困惑到恐惧——凛先以为是生病,几秒后明白过来这是什么,恐惧比羞耻先到:"我的身体在渴望那个";③独自抵抗——她先试图自己躲起来忍过去(锁门/咬手背/夹紧),写足这段徒劳的挣扎;④抵抗崩盘——身体反应越压越凶,最终她不得不(或被发现后被)让打手解决;⑤事后长凝视——凛盯着镜子里的自己,第一次真正明白"回不去了"不是比喻。\n事后:延续摘要记"首次白天身体擅自发情·部位"。此后 daily_erosion 转常规态(身体的背叛成为日常一部分)。\n【写法·身体擅自发情首次专属】\n句式节奏:毫无预兆慢启(长句·白天最寻常时刻看账本/喝茶/训话某被开发部位突然空虚酸软)→困惑到恐惧(节奏凝滞·凛先以为生病几秒后明白过来·恐惧比羞耻先到"我的身体在渴望那个")→独自抵抗(中速·锁门/咬手背/夹紧·写足徒劳挣扎)→抵抗崩盘(短句·身体反应越压越凶最终不得不让打手解决)→事后长凝视收口(降速·凛盯镜子里的自己第一次真正明白"回不去了"不是比喻)。张力在"没有任何人碰她身体自己发情"的首次认知塌陷——堕落长进了身体里。\n技法细节:①毫无预兆——白天最寻常时刻某被开发部位突然空虚酸软(骤变锚);②困惑到恐惧——凛先以为是生病几秒后明白过来,恐惧比羞耻先到"我的身体在渴望那个";③独自抵抗——先试图自己躲起来忍过去(锁门/咬手背/夹紧)写足徒劳挣扎;④抵抗崩盘——身体反应越压越凶最终不得不(或被发现后被)让打手解决;⑤事后长凝视——凛盯镜子里的自己第一次真正明白"回不去了"不是比喻(收尾烙印);⑥堕落内化——此前所有堕落都在"被安排的时间",这是第一次没人碰她身体自己发情=堕落长进身体里(核心)。'}),on({id:'p_rape_living',keys:['wb_rape_living'],content:'轮奸起居·常规。Tier1-2 睡眠时段持续占用(慵懒绵长,非激烈打桩)。\n本场态度: 热情迷恋型的变体——占有欲化作身体嵌套(B4方向②③)。插进去不拔出的贴身感并非支配,是把凛当暖被/肉抱枕/保暖套,摩挲是无意识的宠爱。口吻锚例(睡意黏糊):"嗯……别动……""就这么含着""暖和……"/无意识的鼻音哼唧/半夜含混的"还想要"。\n机制: 凛的睡眠/起居被性化占用。四种睡姿(抱枕夜侍):\n  - 俯卧后入抱枕型(打手最爱·核心): 打手俯压凛后背体重死死压住娇小身体、从后入不拔出,像把她嵌进怀里入睡。臀被体重重压完全贴合打手腰部、两具身体几乎无间隙。阴茎保持勃起连根深插做"保养式蠕动"——把凛躯体当腰部形状完美贴合的抱枕。\n  - 侧卧三明治双插(核心常态): 凛侧卧被前后两打手夹中间——正面插阴道、背后插肛门、三具身体贴紧如饺子馅,凛是夹心。上腿被前方打手抬开,嘴空着可随手塞一根,但不强凑挤不开的姿势。\n  - 后背勺子位(单插·长时): 打手贴背后水平插入,一手枕她头下、另一手无意识揉奶,省力持久,适合插着睡整晚。\n  - 坐抱后入: 打手像人形椅从后包裹,凛背靠陷怀里吞没着,慵懒一发不追求射精只追求结合温度。\n词汇温度分层(本场低温起步·慢热不炸):\n  L1基底(占主体·长时段): 含着/塞着/暖/贴/磨/蹭/腿间湿/穴肉嗦\n  L2偶起(节律升到③④档时): 内壁绞紧/骚水渗出/宫口被顶/酥麻漫上/半梦中迎合\n  L3瞬间(④档深撞肏醒): 灌进去/被顶到高潮/痉挛绞紧/惊醒发现又被插满——撞完回落L1\n随机节律(核心机制): 打手睡中从本能推进四档,大部分时间停在①②——①大频率小幅蠕动(凛不醒,轻声呻吟,穴肉微收缩);②小频率中幅抽送(凛不醒,细碎娇喘,下身无意识配合);③低频大幅抽插(凛微醒,明显淫叫,主动配合);④偶尔突然最大力深撞(凛被肏醒,尖叫高潮痉挛,惊醒才察觉"又被插着")。也会梦中交合把她单方面肏醒。\n避孕套(感官细节): 射精后阴茎不立刻拔出,带套泡着继续;拔出时精液囊卡穴口缓缓拉出——套外壁被爱液润湿的黏腻吸力+精液囊重量,拖离时穴口一阵吸力。用过的套随手挂凛身上或床头;射完再勃起时凛没清醒就被换套再插进去。射精后在凛眼前晃膨胀套:"要是直接射进去会怎样"——勾起恐惧羞耻。\n干到睡着/被顶醒: 睡着=高潮太多次脱力意识沉下去,呻吟变均匀鼻息,打手不拔出慢磨等她睡熟,穴肉睡着了还无意识一缩一缩嗦着。被顶醒=睁眼前先感到体内硬物在动、意识泡梦里分不清梦真;晨光里被顶醒迷糊推上当天第一个高潮——感官信号先于意识,身体先反应(挺腰收缩淌水)脑子才慢半拍察觉"又在被插了"。\n物化(肉抱枕/活体暖套): 插进去不拔出搂着睡,半夜翻身带她一起翻,阴茎睡梦里随生理反应胀大又顶醒她。态度=像抱抱枕一样自然,顺手揉两把睡着的奶,不当回事。\n专属感官:[触]体内常驻硬物的钝胀/体温交换的暖/穴肉无意识嗦动/睡意里的迟钝快感;[视]蜷在打手怀里被嵌住的娇小轮廓/半阖的眼/睡颜被顶撞时的细微抽动/挂身上的用过套;[嗅]体温焖出的混合体味/残精的腥/被窝里的闷热雌汗;[拟声]浅蠕动:噗叽噗叽(慢/黏);半梦呻吟:嗯…唔…嗯❤;深撞肏醒:噗滋——啊❤;鼻息:呼…哈。\n凛体焦点: 蜷成一团的娇小身躯被巨汉整个圈住/睡颜的脆弱与下身被贯穿的反差/半梦中无意识舔唇/被揉捏时半球小奶在掌心溢出。\n爽点轴: 物化(肉套子/肉抱枕)+半梦意识模糊+绵长嵌套占据。基调:慵懒磨蹭,绵长鼻音,L1长时停留偶尔L3瞬炸,降速非打桩。\n结算: 首次→堕落度+;延续摘要记"已开轮奸起居"。注:白日供奉不触发休息debuff;本事件占夜晚格。\n【写法·轮奸起居专属】\n句式节奏:慵懒绵长非打桩——随机节律四档在睡中推进,大部分时间停①②(慢板·大频率小幅蠕动/小频率中幅抽送·凛不醒轻声呻吟细碎娇喘·长时段L1停留)→偶升③(中速·低频大幅抽插凛微醒明显淫叫主动配合·L2)→瞬炸④(短句·偶尔突然最大力深撞凛被肏醒尖叫高潮痉挛·L3)→撞完回落L1(降速·回落长时段基底)。节奏由睡中本能节律决定,L1长时停留偶尔L3瞬炸,降速非打桩。\n感官侧重/词汇池:以物化(肉套子/肉抱枕)+半梦意识模糊+绵长嵌套占据为核心,触(体内常驻硬物钝胀/体温交换暖/穴肉无意识嗦动/睡意迟钝快感),听(浅蠕动噗叽噗叽慢黏/半梦呻吟嗯…唔…嗯❤/深撞肏醒噗滋——啊❤/鼻息呼…哈)。L1长时基底L3瞬炸。\n体描写焦点:蜷成一团娇小身躯被巨汉整个圈住·睡颜脆弱与下身被贯穿反差·半梦无意识舔唇·被揉捏时半球小奶掌心溢出。\n技法细节:①占有欲嵌套——插进去不拔出的贴身感非支配,是把她当暖被/肉抱枕/保暖套,摩挲是无意识宠爱(B4方向②③);②四种睡姿——俯卧后入抱枕型(打手最爱·体重压住从后入不拔出像嵌进怀里)/侧卧三明治双插(前后夹中间像饺子馅)/后背勺子位(单插长时省力持久)/坐抱后入(人形椅从后包裹慵懒一发不追求射精只追求结合温度);③随机节律四档(核心)——①大频率小幅蠕动(不醒轻声呻吟)→②小频率中幅抽送(不醒细碎娇喘下身无意识配合)→③低频大幅抽插(微醒明显淫叫主动配合)→④偶尔最大力深撞(被肏醒尖叫高潮痉挛惊醒才察觉"又被插着");④干到睡着/被顶醒——睡着=高潮太多次脱力意识沉下去呻吟变均匀鼻息,被顶醒=睁眼前先感体内硬物在动意识泡梦里分不清梦真,感官信号先于意识身体先反应脑子才慢半拍察觉"又在被插了";⑤避孕套感官——射后不立刻拔出带套泡着继续,拔出时精液囊卡穴口缓缓拉出黏腻吸力,用过套随手挂身上或床头;⑥物化——像抱抱枕一样自然顺手揉两把睡着的奶不当回事。'}),on({id:'p_rape_living_first',keys:['wb_rape_living_first'],content:'轮奸起居·首次(里程碑·重点扩写)。\n落差核心: "回房休息"是凛白天端着会长架子时的唯一退路——首次发现连这点退路都没了。\n必含节拍:①回房铺床——凛拖着疲惫回房,打手们已经在床上等着,神态自然得像本来就该在那里;②被安置成"抱枕"——某个打手把她拉过去俯卧后入抱住,不容拒绝,其他打手在旁边等位;③第一夜的随机节律——蠕动→抽送→大幅抽插→深撞肏醒的循环,凛在半梦半醒里被反复推上高潮,意识泡碎;④晨光被顶醒——身体先反应淌水脑子才慢半拍察觉"又在被插";⑤起床时穴里还含着——凛意识到从今往后睡眠也不属于自己了。\n事后: 凛接受了"插着睡"会成为常态。延续摘要记"已开轮奸起居·首次发现连睡眠都不属于自己"。\n【写法·轮奸起居首次专属】\n句式节奏:回房铺床慢启(长句·凛拖着疲惫回房打手们已在床上等着神态自然得像本来就该在那里)→被安置成抱枕(短句·某打手把她拉过去俯卧后入抱住不容拒绝其他打手旁边等位)→第一夜随机节律(节奏由睡中本能推进——蠕动→抽送→大幅→深撞肏醒循环·凛半梦半醒被反复推上高潮意识泡碎)→晨光被顶醒(短句·身体先反应淌水脑子才慢半拍察觉"又在被插")→起床含着收口(降速·凛意识到从今往后睡眠也不属于自己)。张力在"回房休息是唯一退路"的首次失守。\n技法细节:①回房铺床——凛拖着疲惫回房打手们已经在床上等着神态自然得像本来就该在那里(骤变锚);②被安置成抱枕——某打手把她拉过去俯卧后入抱住不容拒绝其他打手在旁边等位;③第一夜随机节律——蠕动→抽送→大幅抽插→深撞肏醒的循环,凛在半梦半醒里被反复推上高潮意识泡碎;④晨光被顶醒——身体先反应淌水脑子才慢半拍察觉"又在被插"(核心错乱:感官先于意识);⑤起床含着——凛意识到从今往后睡眠也不属于自己了(收尾烙印)。'}),on({id:'p_serve_advance',keys:['wb_serve_advance'],content:'强占进阶供奉·"以后都是轮奸了"。Tier2 大规模群交轮奸(里程碑·状态转折)。\n触发: 认知防线动摇 + 约100打手(可加多重闸门:打手数/堕落度/认知防线)。霸全:这一夜刷新强占事件,夺取夜晚分配权。一次性状态转折·needsContinuity=是(turning)。\n人物/称呼锚点: 打手人数已突破百人、看不到头;凛仍端着会长架子但已疲惫。打手他称从"大小姐"渐变母狗/肉便器。\n必含节拍:\n  1. 人数压迫起手: 写在场打手多到看不见头(百人+的规模感、数值奇观),挤满大宅。\n  2. 打手摊牌: 打手跟凛"商量"——人太多了,这么一个个轮根本轮不过来。凛端着拒绝/讨价("你们就不能忍一晚?我已经够累了")。\n  3. 不容拒绝: 话没用,凛被一拥而上的打手围住、架起、抱离地,直接开始轮奸(她的"管理者"幻觉被人海碾碎)。\n  4. 大轮奸主体: 按拓扑的大规模群交(下身双插+口含+双手,整组轮换,车轮战不停),操到她意识模糊。快感重心——在这种规模下她的身体被彻底点燃、不受控地迎合。\n  5. 宣告(状态转折收口): 打手当众宣告"从今往后,大小姐的夜晚就只有这个了,不用再挑了"——意识模糊的凛被这句话钉死了往后的夜晚。\n爽点轴: 人数永动确定性 + 管理者沦为玩物的地位崩塌 + 快感淹没意志。基调:高段词,人海规模感,打桩循环。\n状态转折(机制·非内容): 此夜之后,夜晚供奉不再让玩家选方式(口交/性交/肛交…),统一合并成单一【供奉】按钮,内容=轮奸(男人想怎么玩怎么玩)。不是夜晚只剩供奉一个选项(休息等仍在),而是"供奉"这个选项内部不再分方式。数值闸门不可逆。\n禁忌: 不真爱不崩溃;规模模糊化不写精确数字。\n结算: 堕落度+(里程碑);触发"夜晚供奉合并"状态标记;延续摘要(turning):"自第N天起夜晚供奉统一为轮奸,不再分方式"。\n【写法·强占进阶专属】\n句式节奏:人数压迫起手慢启(长句·在场打手多到看不见头百人+规模感数值奇观挤满大宅·节奏被人海压沉)→打手摊牌(中速·跟凛"商量"人太多了轮不过来·凛端着拒绝/讨价"你们就不能忍一晚")→不容拒绝骤变(短句·话没用凛被一拥而上围住架起抱离地直接开始轮奸·"管理者"幻觉被人海碾碎)→大轮奸主体(短句连发·按拓扑大规模群交下身双插+口含+双手整组轮换车轮战·操到意识模糊)→宣告收口(降速·打手当众宣告"从今往后大小姐的夜晚就只有这个了不用再挑"·意识模糊的凛被这句话钉死)。张力在人海规模感+管理者沦为玩物的地位崩塌。\n感官侧重/词汇池:以人数永动确定性(规模模糊化不写精确数字用"排着来/换了不知多少茬/记不清"传达扩张感)+人海规模感为核心,高段词打桩循环。\n体描写焦点:人海(百人+看不到头挤满大宅)·凛(端着会长架子但已疲惫·被架起抱离地)·称呼渐变(打手他称从"大小姐"渐变母狗/肉便器)。\n技法细节:①人数压迫起手——写在场打手多到看不见头(百人+规模感数值奇观)挤满大宅;②打手摊牌——打手跟凛"商量"人太多了一个个轮不过来,凛端着拒绝/讨价;③不容拒绝——话没用凛被一拥而上围住架起抱离地直接开始轮奸(管理者幻觉被人海碾碎);④大轮奸主体——按拓扑大规模群交(下身双插+口含+双手整组轮换车轮战不停)操到意识模糊,身体被彻底点燃不受控迎合;⑤宣告状态转折(核心)——打手当众宣告"从今往后大小姐的夜晚就只有这个了不用再挑",意识模糊的凛被这句话钉死往后夜晚;⑥机制转折——此夜之后夜晚供奉不再让玩家选方式,统一合并成单一【供奉】按钮内容=轮奸(数值闸门不可逆);⑦规模模糊化——不写精确数字用"排着来/换了不知多少茬/记不清"传达扩张感。'}),on({id:'p_buy_condom',keys:['wb_buy_condom'],content:'买避孕套·公开羞耻+体内淫具/移动侵犯(分档按打手数)。Tier1-2 公开羞耻+体内淫具/移动侵犯。\n本场态度: A面装店员看不出的恭敬保镖 + 死角里随意亵玩。打手享受"看大小姐在外人面前强忍"。口吻锚例:对店员"麻烦这个要一箱"(恭敬)、对凛低声"忍住啊大小姐,叫出来就丢人了""夹紧点别让它掉出来"。\n词汇温度分层:\n  L1外壳(公共场所·克制): 货架/收银台/店员/抱箱/结账/排队\n  L2暗涌(体内/死角): 体内跳蛋震动/腿软/夹紧/骚水浸湿内裤/强忍/脸潮红\n  L3失控边缘(差点露馅或上车后): 腿间淌到地面/差点叫出声/上车立刻被按住/双插\n本条=档1(基础·素买): 凛亲自抱箱去便利店/药妆店,无任何淫具——纯粹的公开羞耻:极道千金抱着整箱避孕套站在收银台前,谁都猜得到这箱东西的用途和用量。收银台前停顿——【等玩家输入购买数量】,数字越大店员的眼神越微妙,凛越想快逃。结账后端着脸快步出店。\n(???解禁后被逐级顶替: wb_buy_toy戴玩具→wb_buy_condom_l2被打手带着→wb_buy_condom_l3轿车代购→wb_buy_condom_l4黑市送货。)\n机制: 本档无玩具,羞耻全部来自"被看见+数量荒诞"。停顿输入数量=玩家交互节点。\n痛/羞耻→快感转译: 在外人(店员)眼皮底下强忍,羞耻感放大每一丝快感——越怕被发现身体越敏感,夹紧淫具的动作反而把自己送上高潮边缘;采购的"正常"外壳让淫乱显得更淫乱。\n专属感官:[触]体内跳蛋的持续震动/抱着的套箱重量/强夹时大腿内侧的酸/车内颠簸顶得更深;[视]货架冷光/店员困惑的视线/收银台数字跳动/透过车窗看手下搬套的荒诞画面;[嗅]便利店冷气清香 vs 自己腿间漫出的骚味(怕被店员闻到);[拟声]跳蛋:嗡——(被衣物闷住);凛强忍:咬住的唔/憋回去的气音;结账:扫码哔。\n凛体焦点: 抱箱遮住娇小身体的局促/强忍时绷紧的细腿/潮红一直红到锁骨/夹紧时不自觉并拢的腿。\n爽点轴: 公共场所A/B反差 + 强忍社死边缘 + 规模荒诞(数字奇观)。基调:L1冷外壳与L2暗涌交替,克制中暗潮。\n结算: 库存+(按档),资金-;首次→堕落度+;公开羞耻度推进。\n【写法·买套档1素买专属】\n句式节奏:L1冷外壳与L2暗涌交替——货架前(短句·找到货架意识到量脸从耳根红起)→收银台对峙(中速·店员眼神微妙凛端冷脸结账·【等玩家输入购买数量】数字越大店员越微妙凛越想快逃·节奏被数字奇观拉扯)→出店(短句·端着脸快步出店后背全是汗)。本档无玩具,羞耻全部来自"被看见+数量荒诞",节奏克制中暗潮。\n感官侧重/词汇池:以公开羞耻(极道千金抱整箱避孕套站收银台前谁都猜得到用途和用量)+规模荒诞(数字奇观)为核心,视(货架冷光/店员困惑视线/收银台数字跳动),嗅(便利店冷气清香vs自己腿间漫出骚味怕被店员闻到)。\n体描写焦点:抱箱遮住娇小身体的局促·强忍时绷紧的细腿·潮红一直红到锁骨·夹紧时不自觉并拢的腿。\n技法细节:①档1素买(基础)——凛亲自抱箱去便利店/药妆店无任何淫具,纯粹公开羞耻:极道千金抱整箱避孕套站收银台前谁都猜得到用途和用量;②数量荒诞——收银台前停顿【等玩家输入购买数量】,数字越大店员眼神越微妙凛越想快逃(数字奇观核心);③A面恭敬保镖+B面死角亵玩——打手对店员"麻烦这个要一箱"(恭敬)对凛低声"忍住啊大小姐叫出来就丢人了"(B面);④痛/羞耻→快感——外人眼皮底下强忍羞耻感放大每一丝快感,越怕被发现身体越敏感,采购"正常"外壳让淫乱显得更淫乱;⑤逐级顶替机制——解禁后被wb_buy_toy(戴玩具)→wb_buy_condom_l2(被打手带着)→wb_buy_condom_l3(轿车代购)→wb_buy_condom_l4(黑市送货)逐级顶替;⑥本档无玩具——羞耻全部来自被看见+数量荒诞。'}),on({id:'p_buy_condom_first',keys:['wb_buy_condom_first'],content:'买避孕套·首次(里程碑·素买档·重点扩写)。\n落差核心: 极道千金亲自抱着一箱避孕套站在便利店收银台前——荒诞与社死的复合(本档无玩具,纯羞耻)。\n必含节拍:①领命出门——打手们"忙不开",采购这种小事只能大小姐亲自跑,她还没意识到买的是什么;②货架前的僵直——找到那排货架,意识到要买的量,脸从耳根红起;③收银台对峙——店员眼神微妙,凛端着冷脸结账,玩家被引导输入购买数量(数字越大店员越微妙);④出店——她端着极道千金的架子快步出门,后背全是汗;⑤回宅——打手们清点箱子时的调笑让她明白:这差事以后全是她的。\n事后: 凛意识到"采购避孕套"这件事本身就是堕落的标记——以后只会有更多次。延续摘要记"已开买避孕套(素买档)"。\n【写法·买套首次专属】\n句式节奏:领命出门慢启(长句·打手们"忙不开"采购这种小事只能大小姐亲自跑她还没意识到买的是什么)→货架前僵直(短句·找到那排货架意识到要买的量脸从耳根红起)→收银台对峙(中速·店员眼神微妙凛端冷脸结账·玩家引导输入数量数字越大店员越微妙)→出店(短句·端着极道千金架子快步出门后背全是汗)→回宅收口(降速·打手们清点箱子时调笑让她明白这差事以后全是她的)。张力在"极道千金亲自抱一箱避孕套站便利店收银台"的荒诞社死复合。\n技法细节:①领命出门——打手们"忙不开"采购这种小事只能大小姐亲自跑,她还没意识到买的是什么(舒缓);②货架前僵直——找到那排货架意识到要买的量脸从耳根红起(骤变锚);③收银台对峙——店员眼神微妙凛端着冷脸结账,玩家被引导输入购买数量(数字越大店员越微妙);④出店——她端着极道千金的架子快步出门后背全是汗;⑤回宅调笑——打手们清点箱子时的调笑让她明白这差事以后全是她的(收尾烙印);⑥堕落标记——"采购避孕套"这件事本身就是堕落的标记。'}),on({id:'p_buy_toy',keys:['wb_buy_toy'],content:'买避孕套·档2戴玩具(顶替素买档)。\n新规矩: 出门采购前,打手会当着凛的面往她体内塞一枚遥控跳蛋——"路上解闷"。遥控器在随行打手手里,专挑她排队/和店员对话的时机调强度。\n写法: 素买档的公开羞耻全保留,叠加体内的失控——货架前突然被调强差点踉跄、收银台前潮红到锁骨还要装镇定、声音发颤地报数量。收银台前停顿——【等玩家输入购买数量】。结账出门腿软扶墙,打手低声"大小姐辛苦了"边把档位拧到最大。\n专属感官:[触]跳蛋隔着衣物的嗡鸣震动/强夹时大腿内侧的酸;[视]店员困惑的视线/凛攥紧钱包的指节;[拟声]嗡——(被衣物闷住)/咬住的唔/扫码哔。\n结算: 库存+,资金-;首次→堕落度+。延续摘要记"采购已玩具化"。\n【写法·买套档2戴玩具专属】\n句式节奏:素买档公开羞耻全保留+体内失控叠加——货架前(短句·突然被调强差点踉跄)→收银台(中速·潮红到锁骨还要装镇定·声音发颤报数量·【等玩家输入购买数量】)→出门腿软扶墙(短句·打手低声"大小姐辛苦了"边把档位拧到最大)。遥控器专挑排队/对话时机调强度,节奏被随机调强打断。\n技法细节:①新规矩——出门采购前打手当着凛的面往她体内塞遥控跳蛋"路上解闷",遥控器在随行打手手里;②专挑时机调强——专挑她排队/和店员对话的时机调强度(节奏打断);③素买羞耻全保留——叠加体内失控,货架前差点踉跄/收银台潮红到锁骨装镇定/声音发颤报数量;④出门拧最大——结账出门腿软扶墙打手低声"大小姐辛苦了"边把档位拧到最大。'}),on({id:'p_buy_condom_l2',keys:['wb_buy_condom_l2'],content:'买避孕套·档2跨店扫荡(两三百人规模·顶替档1)。\n量太大,单店吃不下——跨多家店扫荡。核心=车程与店面的交替:两店之间的车程里凛被按在后座持续侵犯,到店时刚被操过的脸还没消红、腿还软,要强撑着进店和店员交流。每家店收银台前都【停顿等玩家输入数量】,店员看着眼前潮红未褪的大小姐和荒诞的采购量,眼神一次比一次微妙。\n写法: 车内(L3放开)与店内(L1死撑)的温度反复横跳是本档灵魂;下一家店永远比上一家更难维持体面。\n专属感官:[触]车内颠簸顶得更深/下车时腿间的黏腻感;[视]一箱箱往后备箱摞的套/店员欲言又止的脸;[拟声]车内啪叽·店内扫码哔的反差。\n结算: 库存+(按档),资金-;首次→堕落度+。延续摘要记"采购已升至跨店扫荡"。\n【写法·买套档2跨店扫荡专属】\n句式节奏:车内(L3放开)与店内(L1死撑)的温度反复横跳(本档灵魂)——车程(短句连发·后座被按住持续侵犯)→到店(中速·刚被操过的脸还没消红腿还软强撑进店和店员交流)→收银台(节奏收紧·店员看眼前潮红未褪的大小姐和荒诞采购量眼神一次比一次微妙·【停顿等玩家输入数量】)→下一家(节奏重启·下一家永远比上一家更难维持体面)。两店间车程与店面交替,温度横跳。\n技法细节:①跨店扫荡——量大单店吃不下跨多家店扫荡;②车程店面交替——两店之间车程里凛被按后座持续侵犯,到店时刚被操过的脸没消红腿还软要强撑进店;③温度横跳(核心)——车内L3放开与店内L1死撑反复横跳是本档灵魂;④每店输入数量——每家店收银台前都【停顿等玩家输入数量】,店员眼神一次比一次微妙;⑤递进——下一家永远比上一家更难维持体面。'}),on({id:'p_buy_condom_l3',keys:['wb_buy_condom_l3'],content:'买避孕套·档3加长轿车代购(近千人规模·顶替档2)。\n量大到凛亲自买不现实——她躺在加长轿车后座被前后双插着(两根)运着走,打手代劳下车采购搬箱。凛透过车窗看着自己的手下一箱一箱往车上搬,数字荒诞到失真;"买不回来就直接内射"的低语威胁(=采购语境的调情,非真播种)让她夹得更紧。收银台交给打手,【停顿输入数量】改为凛在车内隔窗"审批"总量。\n写法: 本档凛全程不下车——羞耻从"店员的眼神"转为"隔着一层车窗玻璃看自己的采购规模",数字奇观前景化。\n结算: 库存+(大宗),资金-;首次→堕落度+。延续摘要记"采购已升至轿车代购"。\n【写法·买套档3轿车代购专属】\n句式节奏:凛全程不下车——后座被前后双插(短句·两根运着走)→隔窗看采购(中速·透过车窗看手下一箱一箱往车上搬数字荒诞到失真)→隔窗审批(短句·【停顿输入数量】改为凛车内隔窗"审批"总量)→低语威胁(短句·"买不回来就直接内射"让她夹得更紧)。羞耻从"店员眼神"转为"隔一层车窗玻璃看自己采购规模",数字奇观前景化。\n技法细节:①量太大亲自买不现实——凛躺加长轿车后座被前后双插(两根)运着走,打手代劳下车采购搬箱;②隔窗看规模——凛透过车窗看手下一箱一箱往车上搬,数字荒诞到失真(数字奇观前景化);③隔窗审批——收银台交给打手,【停顿输入数量】改为凛车内隔窗"审批"总量;④低语威胁——"买不回来就直接内射"的低语(=采购语境调情非真播种)让她夹得更紧;⑤不下车——羞耻从"店员眼神"转为"隔车窗玻璃看自己采购规模"。'}),on({id:'p_buy_condom_l4',keys:['wb_buy_condom_l4'],content:'买避孕套·档4黑市送货上门(终态·顶替档3)。\n黑市渠道打通,采购彻底不用出门——每日整车整车的套直接送进九条宅。本格的"采购"变成凛在宅门口【验货】:黑市送货人卸货时目光在大小姐身上打转(他们全都清楚这些货是往哪儿用的),打手当着送货人的面从新到的箱里拆一只当场"验货试用"。【停顿输入数量】改为签收单上的荒诞数字。\n写法: 羞耻从公共场所转为"外人知情的注视"——送货人心照不宣的眼神+当面验货,是本档核心。篇幅可短(终态日常化)。\n结算: 库存+(整车),资金-;首次→堕落度+。延续摘要记"采购已终态化·送货上门"。\n【写法·买套档4黑市送货专属】\n句式节奏:篇幅可短(终态日常化)——宅门口验货(中速·黑市送货人卸货目光在大小姐身上打转他们都清楚这些货往哪儿用)→当面验货试用(短句·打手当着送货人面从新到的箱里拆一只当场"验货试用")→签收(短句·【停顿输入数量】改为签收单上的荒诞数字)。羞耻从公共场 n_sfw'],content:'庭院散心·SFW模板。无外人,凛在自家日式庭院里小坐,赏锦鲤/听水钵鹿威/看石灯笼。短句随机:"大小姐在锦鲤池边发了会呆""大小姐喂了喂池里的锦鲤""大小姐在水钵前听了一会儿鹿威""大小姐沿飞石走了一圈"。'}),on({id:'p_garden_walk_sfw',keys:['wb_garden_walk_sfw'],content:'庭院散步·SFW(散步健体)。【设定硬约束】凛有罗刹瞳血脉,体能耐力远超常人——散步对她毫无负担,绝不写累/喘/出汗。这是保持身体节律的日课:步伐轻快利落,顺带检视庭院、看锦鲤、在假山旁站桩片刻。简短模板即可:"大小姐绕庭院轻快走了几圈,顺手拨正一块歪掉的飞石""大小姐沿回廊走完日课,气息平稳如常"。(系统会另行提示体质计数进度 n/10,正文不必编造数字。)'}),on({id:'p_walk_toy',keys:['wb_walk_toy'],content:'庭院玩具散步·常规(散步的"新规矩"·顶替普通散步)。\n核心: 凛的健体散步被加上了条件——体内塞着打手挑选的性玩具(跳蛋/拉珠/小型假阳具任选组合)才准散步。走一步蹭一下,锻炼的喘息里混进压不住的甜音。\n写法: 白天庭院、阳光正好,凛表面在做与昨日相同的散步,双腿内侧却在打颤;打手们靠在回廊上"监督锻炼",手里握着遥控器,不定时调档。她想停下,他们提醒"计数还没满"。焦点=凛强忍的身体反应(夹紧/腿软/走姿变形/汗与体液分不清),而非打手动作。\n结算: 首次→堕落度+;散步计数照常累积。延续摘要记"散步已玩具化"。\n【写法·庭院玩具散步专属】\n句式节奏:表层散步常态(长句·白天庭院阳光正好凛表面做与昨日相同的散步)↔里层强忍(短句·双腿内侧打颤/打手回廊监督握遥控器不定时调档/她想停下他们提醒"计数还没满"·节奏被遥控器随机调档打断)。节奏由"锻炼喘息混进压不住甜音"的双轨驱动,焦点=凛强忍的身体反应(夹紧/腿软/走姿变形/汗与体液分不清)而非打手动作。\n感官侧重/词汇池:以强忍身体反应(夹紧/腿软/走姿变形/汗与体液分不清)为核心,触(体内玩具走一步蹭一下)是主轴,听(压不住的甜音混进锻炼喘息)。\n体描写焦点:腿(内侧打颤/走姿变形)·脸(强忍)·走姿(锻炼与调教撕扯)。\n技法细节:①新规矩——凛健体散步被加条件:体内塞打手挑选的性玩具(跳蛋/拉珠/小型假阳具任选组合)才准散步,走一步蹭一下;②双轨散步——表面做与昨日相同的散步,双腿内侧却在打颤;③回廊监督——打手们靠在回廊上"监督锻炼"手里握着遥控器不定时调档;④计数压迫——她想停下他们提醒"计数还没满";⑤焦点=强忍反应——凛强忍的身体反应(夹紧/腿软/走姿变形/汗与体液分不清)而非打手动作;⑥罗刹瞳体能——散步对她毫无负担绝不写累/喘(铁律),腿软全是玩具所致。'}),on({id:'p_walk_toy_first',keys:['wb_walk_toy_first'],content:'庭院玩具散步·首次(里程碑·重点扩写)。\n落差核心: "锻炼身体"这个最健康的日常,第一次被拧成调教——她是为了变强才散步的,现在连变强都要以被玩弄为代价。\n必含节拍:①如常准备散步——凛换好轻装,打手却拦在庭院口,摊开手心里的玩具"新规矩";②塞入与起步——被按着塞入,第一步迈出去就腿软扶墙,打手催"继续,计数才刚开始";③锻炼与调教的撕扯——她试图专注呼吸和步频,遥控器一响全盘破功,喘息变了调;④走完的代价——圈数走满,凛扶着石灯笼平复,发现自己竟分不清腿软是累的还是别的;⑤打手把玩具收回时那句"明天继续"。\n事后: 凛意识到普通的散步已经回不来了。延续摘要记"首次玩具散步·散步范式已顶替"。\n【写法·庭院玩具散步首次专属】\n句式节奏:如常准备散步慢启(长句·凛换好轻装打手却拦在庭院口摊开手心玩具"新规矩")→塞入起步骤变(短句·被按着塞入第一步迈出就腿软扶墙打手催"继续计数才刚开始")→锻炼与调教撕扯(中速·她试图专注呼吸步频遥控器一响全盘破功喘息变了调)→走完代价(降速·圈数走满凛扶石灯笼平复发现自己竟分不清腿软是累的还是别的)→明天继续收口(短句·打手把玩具收回时那句"明天继续")。张力在"锻炼身体被拧成调教·连变强都以被玩弄为代价"的首次认知塌陷。\n技法细节:①如常准备散步——凛换好轻装打手却拦在庭院口摊开手心里的玩具"新规矩"(骤变锚);②塞入起步——被按着塞入第一步迈出去就腿软扶墙,打手催"继续计数才刚开始";③锻炼与调教撕扯——她试图专注呼吸和步频,遥控器一响全盘破功喘息变了调(核心双轨);④走完代价——圈数走满凛扶石灯笼平复,发现自己竟分不清腿软是累的还是别的(核心错乱·罗刹瞳体能下腿软必非累);⑤明天继续——打手把玩具收回时那句"明天继续"(收尾烙印:散步范式已顶替)。'}),on({id:'p_garden_orgy',keys:['wb_garden_orgy'],content:'庭院群交·常规(体质大成的"庆祝"·与遛母狗并行)。Tier1-2 私宅庭院·纯白日宣淫。\n核心: 散步练出来的这具身体,在自家庭院被几十个打手围起来轮换使用——假山石面/回廊木地板/草坪就地铺开,人数与时长都是"体质大成"的规格。\n【必写·打手挥霍避孕套】招牌画面,务必显眼,且要合乎轮奸现场的逻辑——挥霍来自人数、频次与骄奢的用法,不是儿戏:\n  - 整箱避孕套直接搬到庭院,拆开摆在石灯笼上随取随用;\n  - 换人必换套、射一次就换新,有人插到一半嫌闷,拔出来扯掉换只新的再继续;\n  - 排队的打手把套撕好了套在指根上候场,轮到就上,节奏快得来不及省;\n  - 一场下来箱底朝天:满地银色包装皮被踩得咯吱响,用过打结的套在草坪角落越堆越高。\n  凛被换组的间隙里瞥见那堆"消耗",清楚地意识到——库存见底之后的日子意味着什么。这份心凉混着身体的滚烫一起写。\n写法: 多人拓扑照常(下身双穴主轴·口手分配·整组换·换组=节奏断点),笔墨重心永远是凛被轮转时不受控的身体反应;挥霍是持续在场的环境细节,穿插在换人间隙反复入镜。\n专属感官:[视]石灯笼上成排的银色小方块/草坪上的"消耗堆"/白日晴空与赤裸肉体;[听]包装撕开的嘶啦声成了换人的号令/打桩啪叽在庭院回响;[嗅]庭院草木清气被精臭雌臭彻底压过。\n结算: 首次→堕落度+;避孕套库存归零(系统结算)。延续摘要记"已开庭院群交·库存被挥霍一空"。\n【写法·庭院群交专属】\n句式节奏:多人拓扑照常(下身双穴主轴·口手分配·整组换·换组=节奏断点)为主轴,挥霍避孕套(招牌画面)持续在场的环境细节穿插在换人间隙反复入镜。换组间隙=节奏断点写凛被轮转时不受控身体反应+瞥见那堆"消耗"的心凉(心凉混着身体滚烫一起写)。\n感官侧重/词汇池:以挥霍避孕套招牌画面(整箱搬庭院拆开摆石灯笼随取随用/换人必换套射一次换新/排队打手把套套指根候场/满地银色包装皮咯吱响/用过打结套草坪越堆越高)+体质大成规格(几十打手围轮)为核心,听(包装撕开嘶啦声成换人号令/打桩啪叽庭院回响),嗅(庭院草木清气被精臭雌臭彻底压过)。\n体描写焦点:轮转(被轮转时不受控身体反应)·消耗堆(草坪角落越堆越高的打结套)·白日晴空与赤裸肉体。\n技法细节:①体质大成规格——散步练出来的这具身体在自家庭院被几十个打手围起来轮换使用,假山石面/回廊木地板/草坪就地铺开,人数与时长都是"体质大成"规格;②挥霍避孕套(招牌画面·务必显眼·合乎轮奸现场逻辑)——整箱避孕套直接搬庭院拆开摆石灯笼随取随用/换人必换套射一次换新(有人插到一半嫌闷拔出来扯掉换只新的再继续)/排队打手把套撕好套在指根上候场轮到就上节奏快得来不及省/一场下来箱底朝天满地银色包装皮被踩咯吱响用过打结的套草坪角落越堆越高;③心凉混滚烫——凛被换组间隙瞥见那堆"消耗",清楚意识到库存见底之后的日子意味着什么,这份心凉混着身体滚烫一起写(核心);④笔墨重心——永远是凛被轮转时不受控的身体反应,挥霍是持续在场的环境细节穿插换人间隙反复入镜;⑤库存归零——避孕套库存归零(系统结算,接生育线E1)。'}),on({id:'p_garden_dog',keys:['wb_garden_dog'],content:'庭院遛母狗·常规(束缚成母狗·感官剥夺爬行调教)。Tier2 宠物调教·物化羞辱(非直接性交)。\n核心状态(讲给AI): 凛被束缚成一条母狗——戴鼻勾(鼻尖被向上勾起呈猪/狗鼻)、眼罩(视觉剥夺)、手脚对折捆绑(小腿贴大腿、手臂折起),只能用手肘和膝盖着地爬行。嘴、小穴、后穴三处都被粗大假阳具塞满填实。身上挂满装着精液的避孕套(此前轮奸射的、打结挂在身上当装饰/标记)。\n调教玩法: 打手牵着绳子遛她,凛被剥夺视觉只能靠绳子拉扯的方向和鼻子闻气味确定方向爬行。打手让她做宠物狗的行为取乐淫辱——叼东西、原地打转、讨食、"汪"一声才给奖励、爬过来蹭腿。羞辱性人格降格是本阶段重点,不是直接性交(三穴已被假阳具填着,移动中持续被玩具刺激)。\n设施利用(日式庭院): 青苔石板小径(膝盖手肘磨)/锦鲤池/石灯笼/飞石/水钵鹿威。庭院的清雅与母狗化的下流反差。\n专属感官:[触]鼻勾的酸胀/眼罩的黑暗/三穴被假阳具填满的钝胀/手肘膝盖磨石板/挂身上避孕套的重量晃动;[视(打手视角)]娇小身体折成一团爬行/挂满精液套的淫靡装饰/看不见东西的茫然;[嗅]凛靠气味辨向(被剥夺视觉后嗅觉前景化)/青苔泥土/自己身上的精臭;[听]水钵滴答/锦鲤拍水/绳子拖地/凛含着假阳具的呜咽。\ 'wb_dailytoy'],content:'日常淫具化·常规。九条本邸沦为淫窟后,凛的基础生理日常处处被淫具化——吃喝拉撒坐卧都绕不开被插被填。\n机制(多场景轮换·任取其一或串联):\n①坐便器按摩棒:马桶圈内嵌振动按摩棒/假阳具,如厕=坐上去被插被震,排泄与被填同时进行,羞耻地夹着东西解手。\n②假阳具餐具:进食用具改成假阳具造型,深喉式"喂食"——含着假阳具状餐具吞咽,口腔被当食道操,边吃边被顶喉。\n③升降椅淫具:座椅嵌可升降假阳具,凛一坐下即被贯穿,日常坐卧办公都被插着,起身落座皆是抽插。\n受力→快感:基础生理需求(饿/内急/坐下歇)被强制与被插绑定,本能驱使她去满足生理需求=本能驱使她去被操;久而久之身体把"日常"与"被填"画上等号,看到马桶/餐具/椅子就先湿。\n专属感官:[视]坐上马桶时被顶起的小腹/含着假阳具餐具鼓起的腮帮/坐进椅子瞬间没入的长度。[触]如厕时体内的震动/进食时顶喉的钝感/坐下时被撑开的胀。[听]马桶振动的嗡鸣/吞咽混着干呕/椅子升降的机械声与她落座的闷哼。\n爽点轴:日常的彻底沦陷(连最基础的生理需求都被性化)+无处可逃(在自己家、做最普通的事都被操)。基调:荒诞日常感,温水煮青蛙式的习以为常。\n禁忌:排泄描写点到为止不重口,焦点永远是"被插被填的快感"而非排泄物。器具均为情趣道具,不伤身。\n结算:首次各类→堕落度+;延续摘要记"已淫具化:马桶/餐具/椅子(对应项)"。\n【写法·日常淫具化专属】\n句式节奏:随场景轮换——坐便器=如厕与被填同时(慢板·夹着东西解手);假阳具餐具=深喉式喂食(中速·含着吞咽边吃边被顶喉);升降椅=起身落座皆抽插(短句·每次坐下即贯穿)。节奏被"基础生理需求"驱动——饿/内急/坐下歇的本能驱使她去满足=本能驱使她去被操,温水煮青蛙式习以为常。\n感官侧重/词汇池:以"日常动作被性化"的反差荒诞为核心,触觉的体内震动/顶喉钝感/撑开胀 + 听觉的马桶嗡鸣/吞咽干呕/椅子机械声。\n技法细节(场景即淫具):①坐便器按摩棒——马桶圈内嵌振动按摩棒/假阳具,如厕=坐上去被插被震,排泄与被填同时(场景①);②假阳具餐具——食用具改假阳具造型,深喉式喂食含着吞咽口腔被当食道操(场景②);③升降椅淫具——座椅嵌可升降假阳具,一坐下即贯穿起身落座皆抽插(场景③);④本能胁迫——基础生理需求(饿/内急/坐下歇)被强制与被插绑定,本能驱使满足生理需求=本能驱使被操;⑤习以为常——久而久之身体把"日常"与"被填"画等号,看到马桶/餐具/椅子就先湿(温水煮青蛙);⑥禁忌——排泄点到为止不重口,焦点永远是"被插被填的快感"非排泄物,器具均情趣道具不伤身。'}),on({id:'p_dailytoy_first',keys:['wb_dailytoy_first'],content:'日常淫具化·首次(里程碑·重点扩写)。\n落差核心:第一次发现"在自己家做最普通的事也逃不掉了"——私人生活的最后一块净土沦陷。\n必含节拍:①毫无防备的日常——凛像往常一样去用餐/如厕/坐下,以为只是平常一刻;②突然的贯穿——餐具/马桶/椅子里的淫具毫无预兆地填进来,她惊愕地僵在原地;③生理需求的胁迫——饿/内急/腿软逼着她不得不继续(不能不吃不拉不坐),只能含着/坐着/夹着完成;④身体的背叛——本该专注于生理需求,下身却先一步湿了热了,她羞耻于自己连这种时候都有反应;⑤习以为常的恐惧——结束时她意识到,以后每一次用餐如厕坐卧都会是这样,日常本身被改写了。\n事后:凛第一次明白"日常"二字对她已经失效。延续摘要记"已开日常淫具化·私生活沦陷"。\n【写法·日常淫具化首次专属】\n句式节奏:毫无防备日常慢启(长句·凛像往常一样去用餐/如厕/坐下以为平常一刻)→突然贯穿骤变(短句·餐具/马桶/椅子里的淫具毫无预兆填进来她惊愕僵在原地)→生理需求胁迫(节奏被本能拉扯——饿/内急/腿软逼她不得不继续只能含着/坐着/夹着完成)→身体背叛(节奏凝滞·本该专注生理需求下身却先湿了热了她羞耻于连这种时候都有反应)→习以为常恐惧收口(降速·意识到以后每次用餐如厕坐卧都会是这样日常本身被改写)。张力在"私人生活最后净土沦陷"的首次认知塌陷。\n技法细节:①毫无防备——凛像往常一样去用餐/如厕/坐下以为平常一刻(舒缓反差);②突然贯穿——餐具/马桶/椅子里的淫具毫无预兆填进来她惊愕僵在原地(骤变锚);③生理胁迫——饿/内急/腿软逼她不得不继续(不能不吃不拉不坐),只能含着/坐着/夹着完成(本能胁迫);④身体背叛——本该专注生理需求下身却先湿了热了,羞耻于连这种时候都有反应(核心错乱);⑤习以为常恐惧——结束时意识到以后每一次用餐如厕坐卧都会是这样,日常本身被改写(收尾烙印)。'}),on({id:'p_garbage_sfw',keys:['wb_garbage_sfw'],content:'让手下扫除·SFW。大小姐吩咐打手把宅邸打扫干净,清理庭院厅堂。略写或简短模板("大小姐命人把宅子清扫了一番""庭院厅堂总算见了干净")。'}),on({id:'p_garbage',keys:['wb_garbage'],content:'垃圾堆淫乱·常规。本该被"扫除"的九条本邸,反而被打手们故意堆成垃圾场——满地用过的避孕套、空酒瓶、剩饭残渣、脏衣物,凛被按在这片自家沦陷的垃圾堆里轮奸。\n机制:把"威严大宅"与"肮脏垃圾堆"的反差拉满——曾经一尘不染的千金宅邸,如今凛被压在垃圾堆里被多人使用,身上沾着精液脏污垃圾。打手以"反正是你叫人来扫除的"为由头羞辱。\n受力→快感:粗粝肮脏的环境刺激(背后硌着空瓶/脸贴着脏地/身上盖着垃圾)与被插的快感叠加;物化羞辱(被当成垃圾堆里的一件用物)转译成屈辱快感。\n专属感官:[视]满地避孕套酒瓶残渣中凛白皙身体的反差/精液脏污沾在身上/被垃圾半埋着只露出被操的下身。[触]背后硌的硬物/黏腻脏污/被压进垃圾的闷。[听]空瓶滚动碰撞/垃圾窸窣/打手"大小姐的家成了猪窝啊"的哄笑/凛闷在垃圾里的齁叫。\n多人(按拓扑):垃圾堆里铺开,下身双插为主轴,腾得出口手由围站打手使用,以"换个干净点的姿势"为名换组。\n爽点轴:私人空间彻底沦陷(自家变垃圾场)+物化羞辱(被当垃圾用)+反差(高贵宅邸vs肮脏现场)。基调:荒诞淫靡,脏乱中的热烈。\n禁忌:脏污只作环境氛围与羞辱,体液描写仍色情唯美,不写致病/恶心生理反应;焦点是快感与反差羞辱。\n结算:首次→堕落度+;延续摘要记"已开垃圾堆淫乱·宅邸沦陷"。\n【写法·垃圾堆淫乱专属】\n句式节奏:反差铺底慢启(长句·"威严大宅"与"肮脏垃圾堆"的反差拉满·曾经一尘不染如今凛被压垃圾堆里)→粗粝环境叠加(短句·背后硌空瓶/脸贴脏地/身上盖垃圾与被插快感叠加)→物化羞辱(中速·被当垃圾堆里一件用物·打手"大小姐的家成了猪窝"哄笑)→换组轮换收口(降速·"换个干净点的姿势"为名换组)。节奏被脏乱环境与快感的叠加驱动,荒诞淫靡。\n感官侧重/词汇池:以"高贵宅邸vs肮脏现场"的视觉反差 + 粗粝肮脏触感(硌硬物/黏腻脏污/被压闷)为核心,听觉的空瓶滚动/垃圾窸窣/哄笑。\n技法细节:①反差拉满——把"威严大宅"与"肮脏垃圾堆"反差拉满,曾经一尘不染的千金宅邸如今凛被压垃圾堆里被多人使用,身上沾精液脏污垃圾;②扫除为由——打手以"反正是你叫人来扫除的"为由头羞辱;③粗粝环境——背后硌空瓶/脸贴脏地/身上盖垃圾与被插快感叠加(触觉);④物化羞辱——被当成垃圾堆里一件用物转译成屈辱快感;⑤多人拓扑——垃圾堆里铺开下身双插为主轴,腾得出口手由围站打手使用,"换个干净点的姿势"为名换组;⑥禁忌——脏污只作环境氛围与羞辱,体液描写仍色情唯美,不写致病/恶心生理反应,焦点是快感与反差羞辱。'}),on({id:'p_garbage_first',keys:['wb_garbage_first'],content:'垃圾堆淫乱·首次(里程碑·重点扩写)。\n落差核心:第一次目睹"自己的家被亲手糟蹋成猪窝"——她下令扫除,换来的却是被按进垃圾里。\n必含节拍:①下令扫除——凛吩咐打手清理宅子,以为能重见干净;②反向的"打扫"——打手们却把垃圾越堆越多,反把她按进堆里,"大小姐不是要扫除吗?先把您扫进去";③肮脏的贯穿——在脏污垃圾中被压住贯穿,凛又羞又怒于自家沦落至此;④反差的羞耻——曾经一尘不染的宅邸主人,如今滚在垃圾里被操,身份与处境的极致倒错;⑤快感的背叛——明明环境肮脏屈辱,身体却在这反差里越烧越烫。\n事后:凛第一次接受"这个家已经不是那个家了"。延续摘要记"已开垃圾堆淫乱·宅邸彻底沦陷"。\n【写法·垃圾堆首次专属】\n句式节奏:下令扫除慢启(长句·凛吩咐打手清理宅子以为能重见干净)→反向打扫骤变(短句·打手却把垃圾越堆越多反把她按进堆里"先把您扫进去")→肮脏贯穿(中速·脏污垃圾中被压住贯穿凛又羞又怒)→反差羞耻(节奏凝滞·曾经一尘不染的宅邸主人如今滚垃圾里被操身份与处境极致倒错)→快感背叛收口(降速·明明环境肮脏屈辱身体却在这反差里越烧越烫)。张力在"自己的家被亲手糟蹋成猪窝"的首次认知塌陷。\n技法细节:①下令扫除——凛吩咐打手清理宅子以为能重见干净(舒缓反差);②反向打扫——打手们却把垃圾越堆越多反把她按进堆里"大小姐不是要扫除吗?先把您扫进去"(骤变锚);③肮脏贯穿——在脏污垃圾中被压住贯穿凛又羞又怒于自家沦落至此;④反差羞耻——曾经一尘不染的宅邸主人如今滚在垃圾里被操,身份与处境的极致倒错(核心);⑤快感背叛——明明环境肮脏屈辱身体却在这反差里越烧越烫(核心错乱);⑥接受 :L1裸体大衣/陪同/采购→L2体内玩具远程调强/夹紧/腿软/差点叫出声→L3险些当街社死/抱着箱子的颤抖。L3用"社死/颤抖/夹紧"这类失控词,不用内室的露骨性器词(本玩法是羞耻外出非实插)。\n体描写焦点:大衣(贴身全脱只剩一件·开合间随时走光的危机)·腿(夹紧/腿软/走姿变形)·脸(收银台前潮红/强忍的微表情/店员困惑)。镜头钉在大衣下摆与凛强忍的脸,不拍实插(本玩法核心是"看不见的凌辱")。\n技法细节:①大衣赤裸——贴身衣物全脱只留长款大衣,冷风灌入+赤裸皮肤触感前景化(外出的失体面);②远程调强措手不及——打手在死角偷玩遥控器随机调强调弱,凛无法预判每次破绽(强忍的随机性放大紧张);③收银台临界——店员困惑但被极道气场压住不敢多问,凛在对方眼皮底下被顶到临界死忍不出声(差点社死的危机);④冷气vs骚味——便利店冷气与凛身上漫出的骚味形成气味倒错(体味泄露=被动羞耻);⑤夹紧——远程调强让凛夹紧双腿,购物箱抱在怀里靠夹腿防玩具掉出,走姿变形被路人侧目;⑥低语威胁——打手"买不回来就直接内射"的低语(采购语境调情非真播种)让凛夹得更紧,收尾。'}),on({id:'p_condom_zero_2',keys:['wb_condom_zero_2'],content:'避孕套归零·第2次·循环利用废套(生育线E2·里程碑)。Tier1-2 口戴套技法·羞辱物化。\n触发: 库存再次归零且买不及·插入式临时格。打手要凛把用过的套循环利用——废物利用的三步仪式。\n机制(三步·口戴套是核心·讲给AI):\n  1. 取旧套: 从身上/床头/地上捡起射满精液的废套——精液囊的重量、胶皮腥冷触感、残留体液。\n  2. 用嘴吸净: 把旧套整枚送入口腔,用舌头和嗦动将精液囊里的浓精全部吸干净咽下(或被强制咽下)——写腥咸在口腔爆开/呕逆反应/被迫吞咽。套吸净后用舌头逐寸舔净内壁。\n  3. 口戴套(核心技法): 将套圈衔在嘴唇与牙齿之间,用嘴对准对方龟头,以口唇慢慢将套体沿根部滚下——这要求凛俯身近距离对准、动作精细不能弄破、嘴唇要均匀施压。整个过程既是口交前置(龟头进嘴)又是服侍性仪式。戴好后对方直接不拔出就插进来,省去任何间隙。全程双手可被反绑/被按住,只能用嘴完成。\n痛→快感: 恶心感被打断——精液的腥咸把凛拉进"又在服侍肉棒"的身体记忆,口腔腺体开始不受控分泌;戴完套后立刻被插入,恶心被身体直接转化成分泌和绞紧。\n专属感官:[触]腥咸在口腔爆开/废套胶皮凉腥/嘴唇沿根部滚套的阻力/龟头在口中短暂的满充/戴好后直接插入的无缝衔接;[视]精液囊的残留量/胶皮的半透明/凛俯身近距离/口角拉丝;[听]咽下浓精的咕嘟/嘴唇滚套的湿润摩擦/打手称赞"嘴真巧"。\n词汇:L1废套/精液囊→L2吸净/腥咸/呕逆/口戴→L3咽下/嘴唇将套滚下/套好立刻被插/屈辱服侍的彻底性。\n【写法·口戴废套专属】\n句式节奏:取套冷启(短句·废套的重量与腥冷触感砸进来)→吸净慢板(长句·写腥咸在口腔爆开/呕逆/被迫吞咽,节奏被吞咽动作拖慢·标点稀疏)→口戴套精细(节奏收紧·短促动作动词连发,俯身对准/滚下/施压,写"不能弄破"的紧张)→无缝插入收口(节奏骤快·戴好即被贯入,恶心被身体转化成分泌)。全程比口交更慢更脏,张力在"用嘴把套戴上去再被立刻插入"的服侍闭环。\n感官侧重:味+触主导。味(精液腥咸在口腔爆开/胶皮凉腥)与触(废套胶皮凉/嘴唇沿根部滚套的阻力/戴好直接插入的无缝)是双主轴;视(精液囊残留量/胶皮半透明/口角拉丝)次之;听(咽下咕嘟/滚套湿润摩擦)作背景。本玩法味觉权重是六条线里最高的。\n词汇池(口戴套专属温度轴):L1废套/精液囊/胶皮→L2吸净/腥咸/呕逆/口戴/滚下→L3咽下/嘴唇将套滚下/套好立刻被插/屈辱服侍彻底。腥咸/胶皮凉腥是本玩法专属味触词。\n体描写焦点:唇(衔套圈/沿根部滚下的精细动作/均匀施压)·口(腥咸爆开/被迫吞咽/口角拉丝)·手(全程反绑或被按住·只能用嘴完成=束缚感)。镜头钉在唇与口,强调"只用嘴完成"的服侍性。\n技法细节(从语料):①取套冷启——废套的精液囊重量、胶皮腥冷触感、残留体液先砸进感官(冰冷物件vs温热口腔的反差);②吸净慢板——整枚废套送入口腔、舌与嗦动把浓精吸净咽下,腥咸在口腔爆开+呕逆反应+被迫吞咽,套吸净后逐寸舔净内壁(服侍闭环第一步);③口戴套核心技法——套圈衔在唇齿间、俯身近距离对准龟头、口唇慢慢将套体沿根部滚下,动作精细不能弄破、嘴唇均匀施压,既是口交前置(龟头进嘴)又是服侍仪式;④无缝插入——戴好对方直接不拔出就插进来省去间隙,恶心被身体直接转化成分泌与绞紧(痛→快感的转译点);⑤双手束缚——全程双手可被反绑/按住、只能用嘴完成,把"服侍"逼到极致。'}),on({id:'p_condom_zero_3',keys:['wb_condom_zero_3'],content:'避孕套归零·第3次·真播种(生育线E3·终极里程碑·不可逆)。Tier2 全调AI·needsContinuity=是(turning)。\n触发: 套库存再次归零且供奉无法中断·插入式临时格。代码副作用: pregnant=true(此机制由 ForcedEvent.onApply 自动应用,无需 AI 输出依赖)。\n机制(讲给AI): 罗刹瞳加速受孕=第一根内射即可触发受孕判定。从此避孕套保护完全失效。\n场景写法:\n  ①静默瞬间: 最后一根旧套用完丢下时的死寂——之前还在打桩的节奏猛地停下,所有人意识到"没有了"。\n  ②打手们对视和笑声: "完了""真没了""那就这样吧"——不是恶意,是某种早就在等这一刻的释怀。这种态度比恫吓更击穿。\n  ③不戴套贯入: 第一根直接进入,凛感受到的不是抽插,是"没了那一层"的直接皮肤触感——温度更烫、纹理更清、阴茎血管的搏动直接传到内壁。\n  ④浓精灌入子宫: 内射时浓精直接灌进宫口附近,温热饱胀感席卷全身,引发一次性痉挛高潮(子宫=致命弱点)。\n  ⑤打手宣告: "这次全部射进去,确保大小姐这次能怀上"——凛听到时的恐惧 + 身体的高潮余韵 = 错乱(怕乘爽的混乱叠加)。\n  ⑥大义(若灵堂解锁): 接 wb_ancestor_breeding 灵堂宣誓变体——打手提"为九条家延续罗刹之血"播种大义,带凛去先祖堂完成播种仪式。否则在原地继续。\n感官焦点: 无套直接触感/浓精灌子宫温热饱胀/全身性痉挛/凛惊恐于自己身体接受的快感。\n词汇L1: 没有了/最后一个/丢下→L2无套/直接/灌进去/子宫被烫到→L3受孕/种付/子宫灌满/罗刹之血觉醒/用来生孩子/真播种。\n【写法·真播种专属】\n句式节奏:静默骤停(节奏猛停——旧套用完丢下的死寂,从打桩连发骤变为无声,留一拍空白)→对视笑声释怀(慢板·写"完了""那就这样吧"的非恶意释怀,节奏沉而荒诞)→无套贯入凝滞(第一根直接进入那一刻节奏又一停——凛感受到"没了那一层"的直接触感,一句拉长写温度更烫/纹理更清/血管搏动直传内壁)→灌精痉挛(短句炸裂+拟声咕嘟·子宫饱胀引发一次性痉挛高潮)→宣告错乱收口(降速·"确保怀上"的宣告+凛恐惧与高潮余韵叠加)。张力在"没了那一层"的认知塌陷,节奏两次骤停(开头死寂+贯入那一刻)。\n感官侧重:触绝对主导且特写"无套vs有套"的触感差(温度更烫/纹理更清/血管搏动直传内壁/浓精灌入的温热饱胀)→视(无间隙贯入/小腹被灌后鼓胀)→听(死寂→咕嘟灌精)→嗅(无套后精臭雌臭直接混)。本玩法触觉的"那一层消失"是核心,所有感官都围着这个"直接了"的落差。\n词汇池(真播种专属温度轴):L1没有了/最后一个/丢下→L2无套/直接/灌进去/子宫被烫到→L3受孕/种付/子宫灌满/罗刹之血觉醒/用来生孩子/真播种。"无套/直接"的无屏障感与"灌进去/子宫被烫到"的体内直击是本玩法专属,L3真播种词更强调"受孕"结果。\n体描写焦点:穴(无套贯入的直接触感差/内壁第一次直接皮肤接触)·腹(浓精灌入子宫的饱胀鼓起)·脸(静默时的怔忡→灌精时的痉挛失神→宣告时的恐惧错乱)。镜头在"无套的直接"与"灌精的鼓胀"之间,这是真播种的两个焦点。\n技法细节(从语料):①静默骤停——旧套用完丢下时打桩节奏猛停,所有人意识到"没有了",死寂是该事件第一个张力锚;②非恶意释怀——打手对视笑声"那就这样吧"是某种早就在等这一刻的释怀,这种态度比恫吓更击穿(荒诞日常化);③无套触感差——第一根直接进入,凛感受到温度更烫/纹理更清/血管搏动直传内壁的"没了那一层"的直接(核心落差);④灌精子宫鼓胀——内射时浓精直接灌进宫口附近,温热饱胀席卷全身引发一次性痉挛高潮(子宫=致命弱点·内射时子宫鼓胀球形隆起);⑤怕乘爽错乱——"确保怀上"的宣告让凛恐惧+身体高潮余韵同时存在,怕与爽的混乱叠加是该事件标志;⑥宫口受孕反应——无套贯穿时宫口本能下沉张开、身体进入准备受孕状态,凛惊恐于身体的"配合"。\n延续摘要(turning·必写): "避孕套三次归零,真播种触发,判定受孕。生育线开启。从此供奉=无套内射常态。"\n代码后效: 触发后 EngineState.pregnant=true,孕期范式 wb_pregnant 注入夜晚供奉成为常态;endings.pregnant=true 直接锁堕落生育结局倾向。'}),on({id:'p_ancestor_breeding',keys:['wb_ancestor_breeding'],content:'灵堂大义·播种宣誓(生育线变体·E3触发时若灵堂已解锁则路由至此)。Tier2 全调AI·needsContinuity=是。\n环境: 祖师堂/佛龛/牌位正前方·线香檀香烛光摇曳·榻榻米蒲团·家纹幔帐。\n大义借口(打手假借,讲给AI): 打手抬出九条家"延续罗刹之血、让九条家人丁兴旺"的大义,声称给凛播种是为家族繁荣尽忠——把轮奸包装成神圣的"为九条家开枝散叶"的家族仪式。这套大义根植于设定(旁系都觊觎凛生罗刹瞳后代)。\n宣誓淫乱(核心演出): 凛被要求在先祖牌位前当众宣布播种誓言,例如:\n  "请历代先祖大人见证,我的子宫,与我的丈夫们,为了让九条家再次兴旺,将在此完成播种。"\n配合几百"丈夫"轮番内射的荒诞神圣感。每次内射前/后,可以由打手提"再来一遍誓言""让先祖听见""今天必须把大小姐种满"。\n感官焦点: [视]列祖列宗遗像注视下的轮奸/凛仍维持参拜叩首姿势被从后入/线香袅袅烟雾穿过交合处;[触]榻榻米的硬/冰凉地板/被无套贯入的直接;[嗅]檀香肃穆烟气被精臭雌臭污染(气味倒错=核心);[听]堂内极静使每声啪叽刺耳/木鱼诵经余音/凛念誓言的破碎声/打手催促"再说一遍"。\n词汇L1: 先祖/牌位/誓言/参拜→L2大义/播种/家族繁荣/无套内射→L3罗刹之血觉醒/真播种/为九条家生孩子/宿命达成。\n快感转译: 越神圣越亵渎——凛在最庄严的家族场所被无套内射,身体在恐惧+羞耻里却仍诚实分泌迎合,大义被身体的反应反讽。\n【写法·灵堂大义专属】\n句式节奏:宣誓肃穆慢板(长句·线香檀香烛光的环境铺底,凛念誓言用慢而清晰的断句,每个字都庄重)→轮奸亵渎急促(节奏被肉棒插入打断——庄严词句与啪叽撞肉声交错,节奏撕裂)→气味倒错凝滞(精臭雌臭混入檀香那一刻节奏一停,一句拉长写"肃穆被污染")→循环宣誓收口(降速·"再说一遍让先祖听见",凛念着誓言被一遍遍内射,庄严与淫乱彻底焊死)。张力在庄严仪式词与肉声的同频错位。\n感官侧重:嗅主导(檀香肃穆烟气被精臭雌臭污染=气味倒错是核心),凌驾一切;视(列祖列宗遗像注视下的轮奸/参拜叩首姿势被后入/线香袅袅穿过交合处)次之;听(堂内极静使啪叽刺耳/木鱼诵经余音/念誓言的破碎声)作背景;触(被无套贯入的直接/冰凉地板)。本玩法嗅觉权重最高,"神圣气味被污染"是独家羞耻源。\n词汇池(灵堂大义专属温度轴):L1先祖/牌位/誓言/参拜→L2大义/播种/家族繁荣/无套内射→L3罗刹之血觉醒/真播种/为九条家生孩子/宿命达成。庄严词(誓言/参拜/先祖)与淫乱现实(无套内射/轮奸)在同一句里并置是本玩法标志。\n体描写焦点:姿(参拜叩首姿势被从后入——神圣姿势与侵犯动作的同框)·脸(念誓言时的庄严表情被撞碎)·下体(线香袅袅烟雾穿过交合处的视觉反差)。镜头在"牌位前的庄严姿势"与"被轮奸的下体"之间切换,反差即焦点。\n技法细节:①庄严环境铺底——祖师堂/佛龛/牌位正前方·线香檀香烛光摇曳·榻榻米蒲团·家纹幔帐,用环境神圣感做反差压舱石;②大义假借——打手抬出"延续罗刹之血/人丁兴旺"的大义,把轮奸包装成神圣家族仪式(设定根植:旁系觊觎凛生罗刹瞳后代);③当众宣誓——凛被要求在先祖牌位前宣布播种誓言(子宫/丈夫们/为九条家兴旺/完成播种),庄严词句本身即是羞辱;④叩首相奸——凛维持参拜叩首姿势被从后入,神圣姿势与侵犯动作同框(核心反差);⑤气味倒错——檀香肃穆烟气被精臭雌臭污染,神圣气味被肉体气味覆盖(独家羞耻锚);⑥极静放大——堂内极静使每声啪叽刺耳,木鱼诵经余音与撞肉声同频;⑦循环宣誓——每次内射前后打手催"再说一遍/让先祖听见/今天种满",凛念着誓言被一遍遍内射,庄严与淫乱焊死。'}),on({id:'p_pregnant',keys:['wb_pregnant'],content:'孕期(生育线持续状态)。Tier1-2 孕期轮奸(特殊状态·轮奸仍继续)。\n触发: pregnant=true 后,夜晚供奉范式可注入此变体(孕期版),与原供奉范式叠加。\n身体变化(讲给AI): 孕肚发育比常人快(罗刹瞳血脉);娇小体型+罗刹瞳=孕肚鼓出但依然紧窄白嫩,反差感极强(纤腰顶着孕肚被巨汉轮)。乳房微胀更敏感(碰一下就阴道夹紧);阴道更充血热烫;腰腹皮肤延展紧绷感;偶尔的胎动。\n供奉照常: 有打手因此特别兴奋——"给大小姐种进去了""大小姐怀着我的孩子""孕妇的小穴会变更敏感对吗"——大义叙事持续发酵。\n体位调整(按拓扑): 孕肚禁压腹位(种付位需调整为侧卧/坐姿,不直接压腹);后入跪位完全 OK;骑乘可继续但孕妇更易脱力(罗刹瞳无体力问题,但孕肚重量是真的);三明治双插限制下腿的压力。\n快感转译: 孕期凛的敏感度全面上升——同样的打桩力度,内壁绞紧反应更剧烈,高潮更频。她惊恐于"怀着孩子还这么爽"。\nAV卖点(钩到AV系统): 孕期AV是限时高价tag(暗网),孕肚展示/孕肚轮奸成期间AV特化题材。AV系统可解锁"孕期"特化档。\n禁忌: 不写孕期体力不支(罗刹瞳体魄);不沉痛;不写流产风险(罗刹瞳血脉保证)。\n延续摘要(若首次显现): "怀孕状态已显现·肚子开始隆起。"\n【写法·孕期供奉专属】\n句式节奏:常态慢热(孕肚反差铺底·长句写纤腰顶孕肚被巨汉轮的体型反差,标点疏)→敏感放大(节奏比常态性交更易被点燃——同样的打桩力度反应更剧烈,用短句写更频的高潮)→胎动穿插凝滞(偶尔胎动那一刻节奏一停,一句拉长写凛的慌乱与身体的不受控)→大义发酵收口(降速·打手"怀着我的孩子"的兴奋言论)。孕期供奉的节奏整体比常态更易失控,因为敏感度全面上升。\n感官侧重:触主导且强化"孕期敏感倍增"(内壁更充血热烫/绞紧反应更剧烈/乳房碰一下就阴道夹紧)→视(孕肚鼓出但依然紧窄白嫩的体型反差/纤腰顶孕肚被轮)→嗅(孕期体味更浓)→听(更频的高潮媚叫)。本玩法触觉的"敏感倍增"是核心,所有反应都被放大。\n词汇池(孕期专属温度轴):L1孕肚/怀着/敏感→L2充血热烫/绞紧倍增/更频高潮/乳房胀痛→L3怀着孩子还这么爽/孕妇小穴更敏感/种进去的孩子。孕期专属词强调"怀着还更爽"的认知错乱。\n体描写焦点:腹(孕肚鼓出+纤腰的反差·被顶时孕肚随之起伏)·乳(微胀更敏感/碰一下就阴道夹紧/可能渗乳)·腰腹皮肤(延展紧绷感)。镜头死钉孕肚与乳,体型反差(娇小童颜+孕肚+巨汉)是视觉核心。\n技法细节(从语料):①体型反差——娇小体型+罗刹瞳=孕肚鼓出但依然紧窄白嫩,纤腰顶着孕肚被巨汉轮,反差极强;②敏感倍增——孕期敏感度全面上升,同样打桩力度内壁绞紧反应更剧烈/高潮更频(核心机制),凛惊恐"怀着孩子还这么爽";③乳房胀敏——乳房微胀更敏感,碰一下就阴道夹紧(孕期专属联动);④宫口下沉受孕态——孕期身体长期处于准备/渴望状态,阴道更充血热烫;⑤胎动穿插——偶尔胎动作为节奏断点,凛的慌乱与身体不受控并置(孕期独家信号);⑥体位调整——孕肚禁压腹位(种付位改侧卧/坐姿),后入跪位OK,骑乘受孕肚重量影响,三明治双插限制下腿压力;⑦大义发酵——打手"给大小姐种进去了/怀着我的孩子/孕妇小穴更敏感"的兴奋言论持续发酵。'}),on({id:'p_birth_show',keys:['wb_birth_show'],content:'分娩表演(生育线·公开分娩展示)。Tier2 全调AI·needsContinuity=是(turning)。\n机制(讲给AI): 凛的双腿被拉开架在台上(参考"安魂椅"分娩姿势——腿托高翘、双腿大张、下体毫无遮掩、整个人如展品陈列),打手们围在四周观看婴儿出生的全过程。摄像机同时录像(可作AV素材)。分娩的疼痛、宫缩、最终的娩出全程被目击和记录。\n专属感官:[视]被撑开架高的双腿和完全暴露的下体/打手们围观的目光/摄像机的红灯/随宫缩一阵阵的下坠胀感;[触]分娩的宫缩痉挛(与高潮痉挛的混淆)/会阴的撑开感/台面/冰凉医疗感;[听]打手们的低声议论/录像设备的运作声/宫缩时凛压抑不住的破碎呻吟。\n快感转译(本场核心): 分娩的全身性痉挛与极度开发后的身体形成混乱——宫缩带来的酸胀收紧与高潮的痉挛在凛的身体里无法区分,她惊恐于这两件事的相似。被目击/被录像的极度羞辱与这种错乱混合。她在生孩子的痛中体验到不属于这个场景的快感——这本身就是堕落的证据。\n词汇L1: 分娩/宫缩/娩出→L2双腿大张/录像红灯/打手围观→L3产痛和高潮分不清/被记录的彻底失态/罗刹之血诞生。\n【写法·分娩表演专属】\n句式节奏:架展冷启(短句·双腿被拉开架在台上如展品陈列,下体毫无遮掩,节奏被强制固定)→宫缩阵痛慢板(长句·写宫缩一阵阵的下坠胀感,标点随宫缩节律起伏)→痉挛混淆凝滞(产痛与高潮痉挛无法区分那一刻节奏一停,一句拉长点破"分不清")→娩出炸裂(短句连发·分娩的全身性痉挛+被目击录像的羞辱混合)→产后余韵收口(降速·打手围观议论+红灯仍在录)。张力在产痛与快感痉挛的同源性混淆,节奏随宫缩阵痛起伏。\n感官侧重:触(宫缩痉挛与高潮痉挛的混淆/会阴撑开感/台面冰凉医疗感)+视(被撑开架高的双腿/完全暴露的下体/打手围观目光/摄像机红灯)双主轴;听(打手低声议论/录像设备运作/宫缩时破碎呻吟)作背景。本玩法触觉的"产痛≈高潮"混淆是核心,视觉的"被当展品目击"是羞耻源。\n词汇池(分娩专属温度轴):L1分娩/宫缩/娩出→L2双腿大张/录像红灯/打手围观→L3产痛和高潮分不清/被记录的彻底失态/罗刹之血诞生。L3用"分不清/被记录/失态"这类错乱羞耻词,聚焦分娩失态的记录羞辱。\n体描写焦点:腿(被拉开架高如展品/双腿大张无法合拢)·下体(完全暴露/随宫缩下坠胀/娩出的过程被全程目击)·脸(产 口空虚收缩。反复执行: 逼近→骤停→冷却→再逼近。写足生理细节: 悬在顶点前一寸的煎熬/不受控挺腰追逐肉棒的身体背叛/被自己的呻吟变成呜咽哀鸣/脑子里"就差一点"把其它思考全部挤掉。次数要多(至少四五轮),每一轮凛的意志碎一块。\n④温柔逼问: 打手们全程不凶——用看似体贴的语气在每次骤停时凑到耳边问:"想要了吗?""答应的话,马上让大小姐舒服。""只是拍个片而已,又不会少块肉。"温柔和快感剥夺的组合比暴力更瓦解人。凛从怒骂→咬牙沉默→呜咽摇头→终于在某一次骤停的空虚里崩溃。\n⑤答应瞬间(重点着墨): 满脸通红,咬着嘴唇,半晌,用细不可闻的声音挤出"……拍、拍吧……"。打手们欢呼,当场兑现承诺让她高潮——积压数轮的顶点一次爆开,凛在高潮里被抱起来,意识半空白地被簇拥着抬去摄影室。\n⑥摄影室·第一部AV(正片): 灯亮机开。凛被摆到镜头前,从"刚高潮完的失神"里慢慢意识到摄像机红灯亮着。\n  限知视角规则(核心特技): 频繁模拟"固定机位/局部特写"的局限——画面只见凛某局部(趴床上半身/被按住头部/悬空双腿),画外音(密集啪啪/咕啾水声/粗喘/变调淫叫)极狂暴。画面只有下半身被抽插,却听到清晰深喉水声,暗示口腔同时被侵犯,观众必须脑补——限知比全景更色情。\n  镜头凝视: 凛全程知道"被拍着",每次意识到红灯就多一层羞耻,身体却诚实迎合——摄影机把她的堕落变成"作品"。\n⑦收尾: 拍摄结束,导演打手宣布"大小姐出道了",凛瘫在拍摄床上看着回放屏幕里的自己,认知防线被"这段影像永远存在"击穿一层。\n【篇幅要求】本格剧情长、节拍多,明确允许并要求长文——正文不少于5000字,节拍③④⑤合计至少占三分之一。不许略写跳节拍。\n【词汇温度】L1摄影室/器材/拍片 → L2寸止/穴口空虚收缩/挺腰追逐/红灯 → L3就差一点就差一点/被镜头操/在全世界面前高潮。\n禁忌: 严禁"嗓子嘶哑""撕裂"等损伤词(罗刹瞳恢复力);凛的答应=意志溃堤非转性,答应后仍羞耻;不沉痛。\n爽点轴: 高潮控制意志瓦解+镜头凝视物化+限知视角脑补。\n【写法·第一次AV专属】\n句式节奏:供奉起手常态(承接前情·短长句交错起手)→拒绝强硬(短句·凛的最后体面线·节奏硬)→寸止螺旋(本格核心·节奏被人为拉扯——逼近长句蓄势→骤停短句切断→冷却慢板→再逼近,形成"逼近-骤停-冷却-再逼近"的螺旋循环,每轮凛意志碎一块)→温柔逼问连击(骤停间隙用环绕式反问"想要了吗/答应马上让你舒服/只是拍个片"一句叠一句封死思绪)→答应凝滞(那一拍留白·细不可闻的"……拍吧")→高潮爆发(答应后积压顶点一次爆开·短句炸裂)→摄影室限知(正片·固定机位局部特写的局限节奏·画面与画外音错位)→回放收口(降速·看着回放屏幕里自己·"这段影像永远存在"击穿认知)。张力全在寸止螺旋的拉扯,节奏被快感剥夺反复打断重组。\n感官侧重:触主导但被"剥夺"——寸止期触觉(悬在顶点前一寸的煎熬/穴口空虚收缩/不受控挺腰追逐肉棒)是被故意吊着不放,这是本玩法独家;视(摄影机红灯/限知画面只见局部/回放屏幕里的自己)是正片段主轴;听(画外音密集啪啪/咕啾水声/粗喘/变调淫叫与画面错位)是限知核心。本玩法触觉的"被吊着"与视觉的"被拍着"是双引擎。\n词汇池(第一次AV专属温度轴):L1摄影室/器材/拍片→L2寸止/穴口空虚收缩/挺腰追逐/红灯→L3就差一点就差一点/被镜头操/在全世界面前高潮。"就差一点"的环绕重复是寸止期专属压迫词,L3"被镜头操/在全世界面前高潮"是正片专属的镜头羞辱词。\n体描写焦点:腰(寸止时绷紧痉挛前兆/不受控挺腰追逐)·脸(拒绝的强硬→寸止的煎熬→答应的通红咬唇→回放时的认知崩塌)·穴口(寸止时空虚收缩)。镜头(限知段)只见局部——趴床半身/被按住头部/悬空双腿,画外音暗示全景,观众必须脑补。\n技法细节(从语料):①寸止螺旋(核心)——逼近临界→骤停(抽插停或整根拔出只留穴口空虚收缩)→冷却→再逼近,反复四五轮每轮意志碎一块;②身体背叛——悬在顶点前一寸的煎熬下,身体不受控挺腰追逐肉棒、呻吟变呜咽哀鸣、"就差一点"把其它思考挤掉;③温柔逼问连击——骤停间隙环绕式反问("想要了吗/答应马上舒服/只是拍个片")一句叠一句封死思绪,温柔+快感剥夺比暴力更瓦解人;④动作话同步——每顶一下钉一句逼问进身体(寸止期压迫感);⑤限知视角(正片核心特技)——固定机位/局部特写的局限,画面只见局部、画外音极狂暴暗示全景,观众必须脑补(限知比全景更色情);⑥镜头凝视——凛全程知道"被拍着",每次意识红灯就多一层羞耻,身体却诚实迎合,摄影机把堕落变成"作品";⑦高潮兑现——答应后打手当场兑现让她高潮,积压数轮顶点一次爆开(答应=快感勒索的城下之盟非转性);⑧回放洗脑——拍完导演打
